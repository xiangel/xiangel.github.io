<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Schedule loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#f5f5f5}.frame{width:1000px}svg{width:100%;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="d5" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="a5" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2d3142"/></marker>
        <marker id="a5m" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#d5)" opacity="0.55"/>

      <text x="60" y="46" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.18em">单引擎调度循环</text>
      <text x="60" y="80" fill="#2d3142" font-size="24" font-family="'Instrument Serif','Noto Serif CJK SC',serif">生产调度器的一轮（vLLM / SGLang 形状）</text>

      <g font-family="'Geist','Noto Sans CJK SC',sans-serif">
        <rect x="40" y="130" width="160" height="110" rx="8" fill="rgba(79,93,117,0.08)" stroke="#4f5d75"/>
        <text x="56" y="158" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace">1</text>
        <text x="56" y="184" fill="#2d3142" font-size="13" font-weight="600">先保运行中的</text>
        <text x="56" y="206" fill="#7a8399" font-size="11">正在 decode 的</text>
        <text x="56" y="224" fill="#7a8399" font-size="11">请求继续进下一批</text>

        <rect x="230" y="130" width="160" height="110" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
        <text x="246" y="158" fill="#eb6c36" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace">2</text>
        <text x="246" y="184" fill="#2d3142" font-size="13" font-weight="600">显存不够？</text>
        <text x="246" y="206" fill="#7a8399" font-size="11">抢占一个受害者</text>
        <text x="246" y="224" fill="#7a8399" font-size="11">重算或换出腾地方</text>

        <rect x="420" y="130" width="160" height="110" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
        <text x="436" y="158" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace">3</text>
        <text x="436" y="184" fill="#2d3142" font-size="13" font-weight="600">从等待队列 admit</text>
        <text x="436" y="206" fill="#7a8399" font-size="11">FCFS / 优先级 /</text>
        <text x="436" y="224" fill="#7a8399" font-size="11">最长前缀 / SJF</text>

        <rect x="610" y="130" width="160" height="110" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
        <text x="626" y="158" fill="#eb6c36" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace">4</text>
        <text x="626" y="184" fill="#2d3142" font-size="13" font-weight="600">组混合批</text>
        <text x="626" y="206" fill="#7a8399" font-size="11">decode + prefill chunk</text>
        <text x="626" y="224" fill="#7a8399" font-size="11">≤ token 预算</text>

        <rect x="800" y="130" width="160" height="110" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
        <text x="816" y="158" fill="#2d3142" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace">5</text>
        <text x="816" y="190" fill="#2d3142" font-size="14" font-weight="600">一次 FORWARD</text>
        <text x="816" y="214" fill="#7a8399" font-size="11">跑完再回到第 1 步</text>
      </g>

      <line x1="200" y1="185" x2="226" y2="185" stroke="#2d3142" stroke-width="1.6" marker-end="url(#a5)"/>
      <line x1="390" y1="185" x2="416" y2="185" stroke="#2d3142" stroke-width="1.6" marker-end="url(#a5)"/>
      <line x1="580" y1="185" x2="606" y2="185" stroke="#2d3142" stroke-width="1.6" marker-end="url(#a5)"/>
      <line x1="770" y1="185" x2="796" y2="185" stroke="#2d3142" stroke-width="1.6" marker-end="url(#a5)"/>

      <path d="M 880 240 V 320 H 120 V 240" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#a5m)"/>
      <text x="500" y="312" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">每一轮迭代都重来一遍</text>

      <text x="60" y="380" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">先保运行、再抢占、再 admit、最后组混合批 —— 五个优化叠在同一个循环里，而不是互相替代。</text>
    </svg>
  </div>
</body>
</html>
