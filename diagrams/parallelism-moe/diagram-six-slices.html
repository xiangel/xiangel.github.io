<!DOCTYPE html>
<html lang="zh">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#f5f5f5}.frame{width:1000px}svg{width:100%;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 980" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="40" y="36" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.16em">SAME STACK · SIX CUTS</text>
      <text x="40" y="68" fill="#2d3142" font-size="24" font-family="'Instrument Serif','Noto Serif CJK SC',serif">同一份模型结构，六种并行切出六种样子</text>
      <text x="40" y="92" fill="#7a8399" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">颜色 = GPU。看哪一块换了颜色，就知道这种并行切的是哪一段结构。</text>

      <!-- ========== TP（画在第三列，对应「一层仍然太宽」） ========== -->
      <g transform="translate(628,0)">
      <rect x="40" y="110" width="292" height="400" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
      <rect x="56" y="126" width="36" height="16" rx="2" fill="transparent" stroke="#eb6c36"/>
      <text x="74" y="138" fill="#eb6c36" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">TP</text>
      <text x="100" y="139" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">切 hidden size · 每层都在</text>
      <rect x="56" y="156" width="260" height="18" rx="3" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
      <text x="186" y="169" fill="#2d3142" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">Embed · 词表也按 TP 切</text>

      <g font-family="'Geist Mono','Noto Sans CJK SC',monospace" font-size="9" text-anchor="middle">
        <text x="118" y="196" fill="#7a8399">Attn</text>
        <text x="254" y="196" fill="#7a8399">FFN</text>
      </g>
      <g>
        <text x="48" y="228" fill="#7a8399" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">L0</text>
        <rect x="62" y="204" width="30" height="40" rx="3" fill="rgba(235,108,54,0.28)" stroke="#eb6c36"/>
        <rect x="92" y="204" width="30" height="40" rx="3" fill="rgba(79,93,117,0.28)" stroke="#4f5d75"/>
        <rect x="122" y="204" width="30" height="40" rx="3" fill="rgba(45,49,66,0.18)" stroke="#2d3142"/>

        <rect x="62" y="252" width="30" height="40" rx="3" fill="rgba(235,108,54,0.28)" stroke="#eb6c36"/>
        <rect x="92" y="252" width="30" height="40" rx="3" fill="rgba(79,93,117,0.28)" stroke="#4f5d75"/>
        <rect x="122" y="252" width="30" height="40" rx="3" fill="rgba(45,49,66,0.18)" stroke="#2d3142"/>
        <rect x="152" y="252" width="30" height="40" rx="3" fill="rgba(122,131,153,0.40)" stroke="#7a8399"/>

        <rect x="288" y="252" width="28" height="40" rx="3" fill="rgba(122,131,153,0.40)" stroke="#7a8399"/>

        <text x="48" y="324" fill="#7a8399" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">L2</text>
        <rect x="62" y="300" width="30" height="40" rx="3" fill="rgba(235,108,54,0.28)" stroke="#eb6c36"/>
        <rect x="92" y="300" width="30" height="40" rx="3" fill="rgba(79,93,117,0.28)" stroke="#4f5d75"/>
        <rect x="122" y="300" width="30" height="40" rx="3" fill="rgba(45,49,66,0.18)" stroke="#2d3142"/>

        <rect x="288" y="300" width="28" height="40" rx="3" fill="rgba(122,131,153,0.40)" stroke="#7a8399"/>
      </g>
      <rect x="56" y="352" width="260" height="22" rx="3" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
      <text x="186" y="367" fill="#2d3142" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">LM Head · vocab parallel</text>
      <text x="186" y="400" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">4 张卡都持有全部层，矩阵竖切</text>
      <text x="186" y="420" fill="#eb6c36" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">每层 2× all-reduce</text>
      <text x="186" y="440" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">权重 / TP，KV 常常不降</text>
      </g>

      <!-- ========== PP ========== -->
      <rect x="354" y="110" width="292" height="400" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
      <rect x="370" y="126" width="36" height="16" rx="2" fill="transparent" stroke="#4f5d75"/>
      <text x="388" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">PP</text>

      <rect x="370" y="208" width="260" height="44" rx="4" fill="rgba(79,93,117,0.14)" stroke="#4f5d75"/>

      <text x="500" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">GPU 3 · LM Head</text>
      <text x="500" y="436" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">一张卡只装连续若干层</text>
      <text x="500" y="454" fill="#eb6c36" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">阶段边界点对点 · 有气泡</text>

      <!-- ========== DP（画在第一列，对应「先复制」） ========== -->
      <g transform="translate(-628,0)">
      <rect x="668" y="110" width="292" height="400" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
      <rect x="684" y="126" width="36" height="16" rx="2" fill="transparent" stroke="#4f5d75"/>

      <rect x="684" y="160" width="124" height="248" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
      <text x="746" y="182" fill="#eb6c36" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">副本 0</text>
      <rect x="700" y="196" width="92" height="28" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.2)"/>

      <rect x="700" y="276" width="92" height="28" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.2)"/>
      <text x="746" y="294" fill="#2d3142" font-size="10" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">Head</text>
      <text x="746" y="336" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">请求 A</text>
      <text x="746" y="356" fill="#7a8399" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">KV 在本地</text>

      <rect x="820" y="160" width="124" height="248" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
      <text x="882" y="182" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">副本 1</text>
      <rect x="836" y="196" width="92" height="28" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.2)"/>
      <text x="882" y="214" fill="#2d3142" font-size="10" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">Embed</text>
      <rect x="836" y="232" width="92" height="36" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.2)"/>
      <text x="882" y="254" fill="#2d3142" font-size="10" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">L0–L3 完整</text>
      <rect x="836" y="276" width="92" height="28" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.2)"/>
      <text x="882" y="294" fill="#2d3142" font-size="10" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">Head</text>
      <text x="882" y="336" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">请求 B</text>
      <text x="882" y="356" fill="#7a8399" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">KV 在本地</text>
      <text x="814" y="436" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">结构一份都不切，只复制接单</text>
      <text x="814" y="454" fill="#eb6c36" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">推理无梯度同步 · 缓存被摊薄</text>
      </g>

      <!-- ========== SP ========== -->
      <rect x="40" y="528" width="292" height="400" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
      <rect x="56" y="544" width="36" height="16" rx="2" fill="transparent" stroke="#eb6c36"/>

      <text x="100" y="557" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">只切 Norm 的序列</text>
      <text x="56" y="584" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">寄生在 TP 上。一层里：</text>
      <rect x="56" y="598" width="260" height="36" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.22)"/>
      <text x="186" y="620" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">RMSNorm · 按 S 切开（省激活）</text>
      <g>
        <rect x="56" y="642" width="62" height="16" rx="2" fill="rgba(235,108,54,0.25)" stroke="#eb6c36"/>
        <rect x="122" y="642" width="62" height="16" rx="2" fill="rgba(79,93,117,0.25)" stroke="#4f5d75"/>
        <rect x="188" y="642" width="62" height="16" rx="2" fill="rgba(45,49,66,0.14)" stroke="#2d3142"/>
        <rect x="254" y="642" width="62" height="16" rx="2" fill="rgba(122,131,153,0.3)" stroke="#7a8399"/>
      </g>
      <text x="186" y="676" fill="#7a8399" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">token 0–3 4–7 8–11 12–15</text>
      <rect x="56" y="692" width="260" height="52" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
      <text x="186" y="716" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">Attention · 不切</text>

      <text x="186" y="890" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">KV 并不变少</text>
