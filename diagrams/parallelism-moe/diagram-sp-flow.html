<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Sequence parallel: split LayerNorm, gather for attention</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#f5f5f5}.frame{width:1000px}svg{width:100%;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="ar" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2d3142"/></marker>
        <marker id="arA" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="40" y="36" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.16em">SEQUENCE PARALLEL · MEGATRON SP</text>
      <text x="40" y="70" fill="#2d3142" font-size="24" font-family="'Instrument Serif','Noto Serif CJK SC',serif">SP 只决定：这几个词谁来做归一化</text>
      <text x="40" y="96" fill="#7a8399" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">不把词切窄（那是 TP），也不拆注意力（那是 CP）。每个词的向量仍然完整。</text>

      <!-- A -->
      <rect x="40" y="116" width="920" height="196" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
      <rect x="56" y="132" width="36" height="16" rx="2" fill="transparent" stroke="#eb6c36"/>
      <text x="74" y="144" fill="#eb6c36" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">A</text>
      <text x="102" y="145" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">LayerNorm 每个词自己算，不看邻居</text>

      <g font-family="'Instrument Serif','Noto Serif CJK SC',serif" font-size="22" text-anchor="middle">
        <rect x="64" y="168" width="88" height="72" rx="8" fill="rgba(235,108,54,0.10)" stroke="#eb6c36"/>
        <text x="108" y="214" fill="#2d3142">今</text>
        <rect x="168" y="168" width="88" height="72" rx="8" fill="rgba(235,108,54,0.10)" stroke="#eb6c36"/>
        <text x="212" y="214" fill="#2d3142">天</text>
        <rect x="272" y="168" width="88" height="72" rx="8" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
        <text x="316" y="214" fill="#2d3142">真</text>
        <rect x="376" y="168" width="88" height="72" rx="8" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
        <text x="420" y="214" fill="#2d3142">好</text>
      </g>
      <g font-family="'Geist Mono','Noto Sans CJK SC',monospace" font-size="9" text-anchor="middle" fill="#7a8399">
        <text x="108" y="258">完整 H</text>
        <text x="212" y="258">完整 H</text>
        <text x="316" y="258">完整 H</text>
        <text x="420" y="258">完整 H</text>
      </g>
      <rect x="500" y="168" width="436" height="112" rx="8" fill="rgba(235,108,54,0.06)" stroke="#eb6c36"/>
      <text x="718" y="204" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">「今」的归一化只用「今」自己</text>
      <text x="718" y="228" fill="#4f5d75" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">不看「天」，也不看「好」。四次互不相干。</text>
      <text x="718" y="256" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">所以归一化可以分家；注意力不行。</text>

      <!-- B -->
      <rect x="40" y="328" width="920" height="196" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
      <rect x="56" y="344" width="36" height="16" rx="2" fill="transparent" stroke="#4f5d75"/>
      <text x="74" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">B</text>
      <text x="102" y="357" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">只开 TP：权重切开了，这四条向量每张卡还各留一份</text>

      <rect x="56" y="380" width="432" height="120" rx="8" fill="rgba(235,108,54,0.07)" stroke="#eb6c36"/>
      <text x="272" y="404" fill="#eb6c36" font-size="12" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">GPU 0 · LayerNorm</text>
      <g font-family="'Geist','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="600" text-anchor="middle">
        <rect x="76" y="420" width="88" height="56" rx="6" fill="#ffffff" stroke="#eb6c36"/><text x="120" y="454" fill="#2d3142">今</text>
        <rect x="176" y="420" width="88" height="56" rx="6" fill="#ffffff" stroke="#eb6c36"/><text x="220" y="454" fill="#2d3142">天</text>
        <rect x="276" y="420" width="88" height="56" rx="6" fill="#ffffff" stroke="#eb6c36"/><text x="320" y="454" fill="#2d3142">真</text>
        <rect x="376" y="420" width="88" height="56" rx="6" fill="#ffffff" stroke="#eb6c36"/><text x="420" y="454" fill="#2d3142">好</text>
      </g>

      <rect x="512" y="380" width="432" height="120" rx="8" fill="rgba(79,93,117,0.08)" stroke="#4f5d75"/>
      <text x="728" y="404" fill="#4f5d75" font-size="12" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">GPU 1 · LayerNorm</text>
      <g font-family="'Geist','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="600" text-anchor="middle">
        <rect x="532" y="420" width="88" height="56" rx="6" fill="#ffffff" stroke="#4f5d75"/><text x="576" y="454" fill="#2d3142">今</text>
        <rect x="632" y="420" width="88" height="56" rx="6" fill="#ffffff" stroke="#4f5d75"/><text x="676" y="454" fill="#2d3142">天</text>
        <rect x="732" y="420" width="88" height="56" rx="6" fill="#ffffff" stroke="#4f5d75"/><text x="776" y="454" fill="#2d3142">真</text>
        <rect x="832" y="420" width="88" height="56" rx="6" fill="#ffffff" stroke="#4f5d75"/><text x="876" y="454" fill="#2d3142">好</text>
      </g>

      <!-- C -->
      <rect x="40" y="540" width="920" height="332" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
      <rect x="56" y="556" width="36" height="16" rx="2" fill="transparent" stroke="#eb6c36"/>
      <text x="74" y="568" fill="#eb6c36" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">C</text>
      <text x="102" y="569" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">加上 SP：归一化分家 → 注意力前拼回整句 → 再分家</text>

      <text x="56" y="600" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace">1 · LayerNorm 分家</text>
      <rect x="56" y="610" width="280" height="64" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36"/>
      <text x="196" y="636" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">GPU 0 · 今　天</text>
      <text x="196" y="656" fill="#7a8399" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">只做这两个词的归一化</text>
      <rect x="348" y="610" width="280" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
      <text x="488" y="636" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">GPU 1 · 真　好</text>
      <text x="488" y="656" fill="#7a8399" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">只做这两个词的归一化</text>
      <rect x="644" y="610" width="292" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.22)"/>
      <text x="790" y="636" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">每个词仍是完整 H</text>
      <text x="790" y="656" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">SP 不切宽度，只切「哪几个词」</text>

      <line x1="196" y1="674" x2="196" y2="696" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arA)"/>
      <line x1="488" y1="674" x2="488" y2="696" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arA)"/>
      <text x="790" y="692" fill="#eb6c36" font-size="12" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">all-gather 拼回整句</text>

      <text x="56" y="720" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace">2 · Attention · SP 到此停</text>
      <rect x="56" y="728" width="572" height="52" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36"/>
      <text x="342" y="750" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">今　天　真　好　都在</text>
      <text x="342" y="768" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">问「今」必须看见后三个词。KV 并不变少。</text>
      <rect x="644" y="728" width="292" height="52" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.22)"/>
      <text x="790" y="750" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">这里仍走 TP</text>
      <text x="790" y="768" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">按宽度 / 头切开，不是按词</text>

      <line x1="342" y1="780" x2="342" y2="802" stroke="#2d3142" stroke-width="1.6" marker-end="url(#ar)"/>
      <text x="790" y="798" fill="#4f5d75" font-size="12" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">reduce-scatter 再分家</text>

      <text x="56" y="824" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace">3 · 下一层 LayerNorm 继续分家</text>
      <rect x="56" y="832" width="280" height="24" rx="4" fill="rgba(235,108,54,0.10)" stroke="#eb6c36"/>
      <text x="196" y="849" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">GPU 0 又只留 今　天</text>
      <rect x="348" y="832" width="280" height="24" rx="4" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
      <text x="488" y="849" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">GPU 1 又只留 真　好</text>

      <text x="500" y="886" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">省的是归一化时那堆向量的显存，不是权重，也不是 KV</text>
    </svg>
  </div>
</body>
</html>
