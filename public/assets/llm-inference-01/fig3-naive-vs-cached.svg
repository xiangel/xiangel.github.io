<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-label="朴素生成 vs KV Cache：左边每步重算整段，右边先处理问题再只追加新词">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="920" height="480" fill="#FFFFFF"/>

  <!-- Left panel: naive -->
  <rect x="24" y="24" width="420" height="432" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
  <text x="48" y="52" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#B91C1C">
    朴素：每步把整段再算一遍
  </text>
  <text x="48" y="72" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748B">
    重复计算随序列长度平方增长
  </text>

  <g font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="154" y="108" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#F87171" stroke-width="1.6" filter="url(#shadow)"/>
    <text x="234" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">已有的整段</text>

    <line x1="234" y1="164" x2="234" y2="188" stroke="#B91C1C" stroke-width="2" marker-end="url(#arrow)" style="color:#B91C1C"/>

    <rect x="134" y="190" width="200" height="64" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.6" filter="url(#shadow)"/>
    <text x="234" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#991B1B">完整前向</text>
    <text x="234" y="236" text-anchor="middle" font-size="11" fill="#64748B">历史 attention 再算一遍</text>

    <line x1="234" y1="254" x2="234" y2="278" stroke="#B91C1C" stroke-width="2" marker-end="url(#arrow)" style="color:#B91C1C"/>

    <rect x="154" y="280" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#F87171" stroke-width="1.6" filter="url(#shadow)"/>
    <text x="234" y="312" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">抽出下一个词</text>

    <path d="M 154 308 C 88 308, 88 136, 154 136" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)" style="color:#94A3B8"/>
    <text x="72" y="224" text-anchor="middle" font-size="11" font-weight="600" fill="#64748B" transform="rotate(-90 72 224)">拼回再跑</text>
  </g>

  <!-- Right panel: cached -->
  <rect x="476" y="24" width="420" height="432" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2"/>
  <text x="500" y="52" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#047857">
    有缓存：问题算一次，后面只追加
  </text>
  <text x="500" y="72" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748B">
    Prefill 写 KV · Decode 只算新 token
  </text>

  <g font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="606" y="108" width="160" height="56" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6" filter="url(#shadow)"/>
    <text x="686" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">整段问题</text>

    <line x1="686" y1="164" x2="686" y2="188" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" style="color:#334155"/>

    <rect x="586" y="190" width="200" height="56" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6" filter="url(#shadow)"/>
    <text x="686" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C">Prefill · 先处理问题</text>

    <line x1="786" y1="218" x2="822" y2="218" stroke="#059669" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow)" style="color:#059669"/>

    <rect x="824" y="190" width="52" height="56" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#shadow)"/>
    <text x="850" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">K/V</text>
    <text x="850" y="232" text-anchor="middle" font-size="10" fill="#64748B">cache</text>

    <line x1="686" y1="246" x2="686" y2="270" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" style="color:#334155"/>

    <rect x="586" y="272" width="200" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6" filter="url(#shadow)"/>
    <text x="686" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">Decode · 再吐一个词</text>

    <path d="M 824 246 C 824 304, 786 304, 786 304" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow)" style="color:#059669"/>
    <text x="812" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">读历史</text>

    <line x1="786" y1="300" x2="824" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" style="color:#334155"/>

    <rect x="824" y="272" width="52" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6" filter="url(#shadow)"/>
    <text x="850" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">新词</text>

    <path d="M 850 272 C 850 170, 850 170, 850 246" fill="none" stroke="#059669" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow)" style="color:#059669"/>
    <text x="872" y="252" text-anchor="start" font-size="11" font-weight="600" fill="#059669">追加</text>
  </g>

  <!-- VS divider -->
  <circle cx="460" cy="240" r="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="460" y="246" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#64748B">VS</text>
</svg>
