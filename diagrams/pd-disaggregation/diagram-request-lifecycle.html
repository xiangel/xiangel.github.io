<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request lifecycle · Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; }
    body { background: var(--color-paper); }
    .frame { width: 1000px; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lifecycle-title lifecycle-desc">
      <title id="lifecycle-title">Lifecycle of one request in a disaggregated system</title>
      <desc id="lifecycle-desc">A request flows left to right from the client to the router or frontend, then to a prefill worker that computes the KV cache, then across a KV transfer step over NIXL or RDMA, then to a decode worker that generates tokens, which are streamed back to the client.</desc>
      <defs>
        <pattern id="lc-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="lc-arrow" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2d3142"/></marker>
        <marker id="lc-arrow-m" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#lc-dots)" opacity="0.55"/>

      <!-- Heading -->
      <text x="60" y="46" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" letter-spacing="0.18em">REQUEST LIFECYCLE</text>
      <text x="60" y="78" fill="#2d3142" font-size="26" font-family="'Instrument Serif', serif">Lifecycle of one request in a disaggregated system</text>

      <!-- Flow arrows (behind boxes) -->
      <line x1="208" y1="258" x2="248" y2="258" stroke="#2d3142" stroke-width="1.8" marker-end="url(#lc-arrow)"/>
      <line x1="396" y1="258" x2="436" y2="258" stroke="#2d3142" stroke-width="1.8" marker-end="url(#lc-arrow)"/>
      <line x1="584" y1="258" x2="624" y2="258" stroke="#2d3142" stroke-width="1.8" marker-end="url(#lc-arrow)"/>
      <line x1="772" y1="258" x2="812" y2="258" stroke="#2d3142" stroke-width="1.8" marker-end="url(#lc-arrow)"/>

      <!-- 1. client -->
      <rect x="60" y="210" width="148" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="210" width="148" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="72" y="222" width="34" height="13" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="89" y="231" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">EXT</text>
      <text x="134" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">client</text>
      <text x="134" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">browser</text>

      <!-- 2. router / frontend -->
      <rect x="248" y="210" width="148" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="210" width="148" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="260" y="222" width="44" height="13" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="282" y="231" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">ROUTE</text>
      <text x="322" y="262" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">router /</text>
      <text x="322" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">frontend</text>

      <!-- 3. prefill worker (accent) -->
      <rect x="436" y="210" width="148" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="436" y="210" width="148" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="448" y="222" width="52" height="13" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="474" y="231" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">PREFILL</text>
      <text x="510" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">prefill worker</text>
      <text x="510" y="284" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">compute KV</text>

      <!-- 4. KV transfer (store / ink) -->
      <rect x="624" y="210" width="148" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="624" y="210" width="148" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="636" y="222" width="36" height="13" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="654" y="231" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">MOVE</text>
      <text x="698" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">KV transfer</text>
      <text x="698" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NIXL / RDMA</text>

      <!-- 5. decode worker (muted) -->
      <rect x="812" y="210" width="148" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="812" y="210" width="148" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="824" y="222" width="50" height="13" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="849" y="231" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">DECODE</text>
      <text x="886" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">decode worker</text>
      <text x="886" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">generate</text>

      <!-- return: stream tokens back to client -->
      <path d="M 886,306 V 350 H 134 V 306" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#lc-arrow-m)"/>
      <rect x="404" y="342" width="192" height="16" rx="2" fill="#f5f5f5"/>
      <text x="500" y="354" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">stream tokens back to client</text>

      <!-- Legend -->
      <line x1="60" y1="398" x2="960" y2="398" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="414" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="60" y="428" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="84" y="437" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">prefill</text>
      <rect x="180" y="428" width="16" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
      <text x="204" y="437" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">decode / KV move</text>
      <line x1="360" y1="433" x2="388" y2="433" stroke="#2d3142" stroke-width="1.8" marker-end="url(#lc-arrow)"/>
      <text x="396" y="437" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">forward path</text>
      <line x1="520" y1="433" x2="548" y2="433" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#lc-arrow-m)"/>
      <text x="556" y="437" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">token stream back</text>
    </svg>
  </div>
</body>
</html>
