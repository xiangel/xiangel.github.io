<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>One decoder block: which op each parallel strategy cuts</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#f5f5f5}.frame{width:1000px}svg{width:100%;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="ar" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2d3142"/></marker>
        <marker id="arA" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="40" y="36" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.16em">ONE DECODER BLOCK · 算子 × 并行</text>
      <text x="40" y="70" fill="#2d3142" font-size="24" font-family="'Instrument Serif','Noto Serif CJK SC',serif">一层里，每道算子被哪种并行切开</text>
      <text x="40" y="96" fill="#7a8399" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">PP 决定这一层住在哪张卡；DP 决定这张卡接哪几条请求。下面是层内的并行。</text>

      <!-- flow boxes -->
      <rect x="40" y="124" width="110" height="88" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.22)"/>
      <text x="95" y="158" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">输入</text>
      <text x="95" y="180" fill="#7a8399" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">[B, S, H]</text>
      <text x="95" y="198" fill="#eb6c36" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">DP 切 B</text>

      <line x1="150" y1="168" x2="178" y2="168" stroke="#2d3142" stroke-width="1.5" marker-end="url(#ar)"/>

      <rect x="182" y="124" width="130" height="88" rx="8" fill="#ffffff" stroke="#4f5d75"/>
      <text x="247" y="152" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">RMSNorm</text>
      <text x="247" y="174" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">几乎无权重</text>
      <text x="247" y="196" fill="#eb6c36" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">SP 切 S</text>

      <line x1="312" y1="168" x2="340" y2="168" stroke="#2d3142" stroke-width="1.5" marker-end="url(#ar)"/>

      <rect x="344" y="124" width="150" height="88" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
      <text x="419" y="152" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">QKV 线性</text>
      <text x="419" y="174" fill="#7a8399" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">Column Parallel</text>
      <text x="419" y="196" fill="#eb6c36" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">TP 切 H</text>

      <line x1="494" y1="168" x2="522" y2="168" stroke="#2d3142" stroke-width="1.5" marker-end="url(#ar)"/>

      <rect x="526" y="116" width="170" height="104" rx="8" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1.6"/>
      <text x="611" y="148" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">Attention</text>
      <text x="611" y="170" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">读本请求的 KV</text>
      <text x="611" y="190" fill="#eb6c36" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">CP 切 S · TP 切头</text>
      <text x="611" y="206" fill="#4f5d75" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">SP 到此为止，不进这里</text>

      <line x1="696" y1="168" x2="724" y2="168" stroke="#2d3142" stroke-width="1.5" marker-end="url(#ar)"/>

      <rect x="728" y="124" width="150" height="88" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
      <text x="803" y="152" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">Out 线性</text>
      <text x="803" y="174" fill="#7a8399" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">Row Parallel</text>
      <text x="803" y="196" fill="#eb6c36" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">TP + all-reduce</text>

      <line x1="803" y1="212" x2="803" y2="248" stroke="#2d3142" stroke-width="1.5" marker-end="url(#ar)"/>

      <!-- second row FFN -->
      <rect x="526" y="252" width="170" height="88" rx="8" fill="#ffffff" stroke="#4f5d75"/>
      <text x="611" y="284" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">RMSNorm</text>
      <text x="611" y="306" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">激活仍在</text>
      <text x="611" y="324" fill="#eb6c36" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">SP 切 S</text>

      <line x1="696" y1="296" x2="724" y2="296" stroke="#2d3142" stroke-width="1.5" marker-end="url(#ar)"/>

      <rect x="728" y="244" width="232" height="104" rx="8" fill="rgba(79,93,117,0.08)" stroke="#4f5d75" stroke-width="1.6"/>
      <text x="844" y="276" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">FFN / MoE</text>
      <text x="844" y="298" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">Dense：TP 切 hidden</text>
      <text x="844" y="318" fill="#eb6c36" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">MoE：EP 切专家</text>
      <text x="844" y="336" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">出口再一次 all-reduce 或 combine</text>

      <!-- connecting line from out down to norm - already have -->
      <path d="M803 248 L803 252" fill="none"/>
      <path d="M803 248 C803 248, 611 248, 611 252" fill="none" stroke="#2d3142" stroke-width="1.4" marker-end="url(#ar)"/>

      <!-- constraints band -->
      <rect x="40" y="372" width="920" height="236" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
      <text x="56" y="400" fill="#eb6c36" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.10em">切开之后立刻面对的约束</text>

      <g font-family="'Geist','Noto Sans CJK SC',sans-serif" font-size="13">
        <text x="56" y="432" fill="#2d3142" font-weight="600">TP</text>
        <text x="96" y="432" fill="#4f5d75">H 和注意力头数必须能整除；GQA 头不够时 KV 会被复制。层内同步，decode 小消息最怕跨节点。</text>
        <text x="56" y="460" fill="#2d3142" font-weight="600">SP</text>
        <text x="96" y="460" fill="#4f5d75">必须已经开 TP。省的是 Norm 激活，不是 KV。注意力前要 all-gather 把序列拼回来。</text>
        <text x="56" y="488" fill="#2d3142" font-weight="600">CP</text>
        <text x="96" y="488" fill="#4f5d75">Ulysses 要求头数 ≥ CP 度；DCP 不加人，上界约 tp / KV头；PCP 才乘进 world size。</text>
        <text x="56" y="516" fill="#2d3142" font-weight="600">PP</text>
        <text x="96" y="516" fill="#4f5d75">层数最好能整除。通信便宜，但 batch=1 时气泡按 1/p 塌掉，TTFT 被流水线拉长。</text>
        <text x="56" y="544" fill="#2d3142" font-weight="600">DP</text>
        <text x="96" y="544" fill="#4f5d75">权重复制，模型仍然要能装进一份副本。前缀缓存被摊到不同副本上，命中率下降。</text>
        <text x="56" y="572" fill="#2d3142" font-weight="600">EP</text>
        <text x="96" y="572" fill="#4f5d75">专家数应能整除。all-to-all 跟路由走，墙钟看最忙的卡；两种 DeepEP 内核不能同居。</text>
      </g>
    </svg>
  </div>
</body>
</html>
