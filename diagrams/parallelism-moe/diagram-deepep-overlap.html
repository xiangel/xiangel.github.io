<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>DeepEP kernels and dual-batch overlap</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#f5f5f5}.frame{width:1000px}svg{width:100%;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="ar" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2d3142"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="48" y="42" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.18em">DEEPEP · DUAL-BATCH OVERLAP</text>
      <text x="48" y="76" fill="#2d3142" font-size="26" font-family="'Instrument Serif','Noto Serif CJK SC',serif">两种通信内核，再加重叠两个微批次</text>
      <text x="48" y="102" fill="#7a8399" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">all-to-all 藏不住时，先换内核，再把通信塞进另一批的计算空隙</text>

      <!-- two kernels -->
      <rect x="48" y="128" width="440" height="168" rx="10" fill="rgba(235,108,54,0.07)" stroke="#eb6c36"/>
      <rect x="64" y="144" width="120" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)"/>
      <text x="124" y="156" fill="#eb6c36" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle" letter-spacing="0.08em">HIGH-THROUGHPUT</text>
      <text x="64" y="186" fill="#2d3142" font-size="18" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">高吞吐内核 · Prefill</text>
      <text x="64" y="212" fill="#4f5d75" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">消息大、带宽优先。把 dispatch / combine</text>
      <text x="64" y="232" fill="#4f5d75" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">打满 IB / NVLink 的管道。</text>
      <text x="64" y="262" fill="#7a8399" font-size="12" font-family="'Geist Mono','Noto Sans CJK SC',monospace">适合：长 prompt、大 micro-batch</text>
      <text x="64" y="282" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">目标是 tokens / s，不是单步延迟</text>

      <rect x="512" y="128" width="440" height="168" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.22)"/>
      <rect x="528" y="144" width="120" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)"/>
      <text x="588" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle" letter-spacing="0.08em">LOW-LATENCY</text>
      <text x="528" y="186" fill="#2d3142" font-size="18" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">低延迟内核 · Decode</text>
      <text x="528" y="212" fill="#4f5d75" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">消息小、延迟优先。少一次握手、</text>
      <text x="528" y="232" fill="#4f5d75" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">走 IBGDA / P2P，把尾延迟压下来。</text>
      <text x="528" y="262" fill="#7a8399" font-size="12" font-family="'Geist Mono','Noto Sans CJK SC',monospace">适合：每步 1 token、EP 很大</text>
      <text x="528" y="282" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">目标是 TPOT，不是管道利用率</text>

      <rect x="48" y="312" width="904" height="48" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36"/>
      <text x="500" y="342" fill="#2d3142" font-size="14" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">同一通信组不能同时跑两种内核 → 这就是第四篇 PD 分离在 MoE 上变成刚需的原因</text>

      <!-- dual batch -->
      <text x="48" y="392" fill="#4f5d75" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.12em">DUAL-BATCH OVERLAP / TBO　两个微批次交错：一批算，一批传</text>

      <text x="48" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">批次 A</text>
      <g font-family="'Geist Mono','Noto Sans CJK SC',monospace" font-size="11" font-weight="600" text-anchor="middle">
        <rect x="120" y="408" width="160" height="40" rx="5" fill="rgba(235,108,54,0.16)" stroke="#eb6c36"/><text x="200" y="433" fill="#2d3142">计算 GEMM</text>
        <rect x="288" y="408" width="160" height="40" rx="5" fill="#ffffff" stroke="#eb6c36"/><text x="368" y="433" fill="#eb6c36">通信 A2A</text>
        <rect x="456" y="408" width="160" height="40" rx="5" fill="rgba(235,108,54,0.16)" stroke="#eb6c36"/><text x="536" y="433" fill="#2d3142">计算 GEMM</text>
        <rect x="624" y="408" width="160" height="40" rx="5" fill="#ffffff" stroke="#eb6c36"/><text x="704" y="433" fill="#eb6c36">通信 A2A</text>
      </g>

      <text x="48" y="484" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">批次 B</text>
      <g font-family="'Geist Mono','Noto Sans CJK SC',monospace" font-size="11" font-weight="600" text-anchor="middle">
        <rect x="120" y="464" width="160" height="40" rx="5" fill="#ffffff" stroke="#4f5d75"/><text x="200" y="489" fill="#4f5d75">通信 A2A</text>
        <rect x="288" y="464" width="160" height="40" rx="5" fill="rgba(79,93,117,0.12)" stroke="#4f5d75"/><text x="368" y="489" fill="#2d3142">计算 GEMM</text>
        <rect x="456" y="464" width="160" height="40" rx="5" fill="#ffffff" stroke="#4f5d75"/><text x="536" y="489" fill="#4f5d75">通信 A2A</text>
        <rect x="624" y="464" width="160" height="40" rx="5" fill="rgba(79,93,117,0.12)" stroke="#4f5d75"/><text x="704" y="489" fill="#2d3142">计算 GEMM</text>
      </g>
      <rect x="800" y="408" width="152" height="96" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
      <text x="876" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">墙钟 ≈ max(计算, 通信)</text>
      <text x="876" y="468" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">而不是两者相加</text>
      <text x="876" y="488" fill="#eb6c36" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">LMSYS TBO +27–35%</text>

      <text x="500" y="548" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">脚注：训练里的 DualPipe 是前向/反向重叠，和这里的推理 Dual-batch overlap 不是同一件事</text>
    </svg>
  </div>
</body>
</html>
