<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colocated vs disaggregated · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36; }
    body { background: var(--color-paper); }
    .frame { width: 1000px; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="colo-disagg-title colo-disagg-desc">
      <title id="colo-disagg-title">PD disaggregation: split prefill and decode onto separate GPU pools</title>
      <desc id="colo-disagg-desc">Left: a colocated deployment where prefill and decode share one GPU and contend for it under a single coupled configuration. Right: a disaggregated deployment with a separate prefill pool and decode pool connected by a KV cache 交接, so each phase scales and tunes independently with no interference.</desc>
      <defs>
        <pattern id="cd-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="cd-arrow-ink" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2d3142"/></marker>
        <marker id="cd-arrow-both" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#cd-dots)" opacity="0.55"/>

      <!-- Heading -->
      <text x="60" y="44" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.18em">PD 分离</text>
      <text x="60" y="76" fill="#2d3142" font-size="26" font-family="'Instrument Serif','Noto Serif CJK SC',serif">把 prefill 和 decode 拆到不同 GPU 池</text>
      <text x="60" y="102" fill="#4f5d75" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">别再共用一张卡：每个阶段自己的池，KV cache 在中间交接。</text>

      <!-- Panel labels -->
      <text x="60" y="150" fill="#eb6c36" font-size="12" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.10em" font-weight="500">COLOCATED — 互相干扰 + 配置绑死</text>
      <text x="540" y="150" fill="#2d3142" font-size="12" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.10em" font-weight="500">DISAGGREGATED — 两个池 + KV 交接</text>

      <!-- ===== LEFT: colocated ===== -->
      <rect x="60" y="176" width="384" height="252" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="176" y="180" width="152" height="14" rx="2" fill="#f5f5f5"/>
      <text x="252" y="190" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle" letter-spacing="0.14em">一张 GPU（colocated）</text>

      <!-- prefill (accent) -->
      <rect x="88" y="236" width="148" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="88" y="236" width="148" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="162" y="272" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">prefill</text>
      <text x="162" y="290" fill="#eb6c36" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">算力密集</text>

      <!-- decode (muted) -->
      <rect x="268" y="236" width="148" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="268" y="236" width="148" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
      <text x="342" y="272" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">decode</text>
      <text x="342" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">延迟敏感</text>

      <!-- contend marker -->
      <line x1="240" y1="276" x2="264" y2="276" stroke="#eb6c36" stroke-width="1.6" marker-start="url(#cd-arrow-both)" marker-end="url(#cd-arrow-both)"/>

      <text x="252" y="356" fill="#eb6c36" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="600">抢同一张 GPU</text>
      <text x="252" y="382" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">一套 TP / 一套硬件两边共用；</text>
      <text x="252" y="400" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">大 prefill 一来，decode 就卡住</text>

      <!-- ===== RIGHT: disaggregated ===== -->
      <!-- prefill pool -->
      <rect x="540" y="200" width="188" height="176" rx="8" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="560" y="204" width="112" height="14" rx="2" fill="#f5f5f5"/>
      <text x="616" y="214" fill="#eb6c36" font-size="8" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle" letter-spacing="0.14em">PREFILL 池</text>
      <rect x="562" y="248" width="72" height="72" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="598" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">P1</text>
      <rect x="642" y="248" width="72" height="72" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="678" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">P2</text>
      <text x="634" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">小 TP · 算力型硬件</text>

      <!-- KV handoff (ink) -->
      <line x1="732" y1="284" x2="792" y2="284" stroke="#2d3142" stroke-width="1.8" marker-end="url(#cd-arrow-ink)"/>
      <rect x="734" y="256" width="58" height="14" rx="2" fill="#f5f5f5"/>
      <text x="763" y="266" fill="#2d3142" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle" letter-spacing="0.06em">KV CACHE</text>
      <text x="763" y="306" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">RDMA/NVLink</text>

      <!-- decode pool -->
      <rect x="796" y="200" width="164" height="176" rx="8" fill="rgba(79,93,117,0.08)" stroke="#4f5d75" stroke-width="1.2"/>
      <rect x="812" y="204" width="112" height="14" rx="2" fill="#f5f5f5"/>
      <text x="868" y="214" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle" letter-spacing="0.14em">DECODE 池</text>
      <rect x="810" y="248" width="44" height="72" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="832" y="288" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">D1</text>
      <rect x="860" y="248" width="44" height="72" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="882" y="288" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">D2</text>
      <rect x="910" y="248" width="44" height="72" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="932" y="288" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">D3</text>
      <text x="878" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">大 TP · 带宽型硬件</text>

      <text x="750" y="404" fill="#2d3142" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">互不干扰 · 每个阶段独立伸缩、独立调参</text>

      <!-- Legend -->
      <line x1="60" y1="470" x2="960" y2="470" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="486" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.18em">图例</text>
      <rect x="60" y="500" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="84" y="509" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans CJK SC',sans-serif">prefill（算力密集）</text>
      <rect x="270" y="500" width="16" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
      <text x="294" y="509" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans CJK SC',sans-serif">decode（带宽密集）</text>
      <line x1="480" y1="505" x2="508" y2="505" stroke="#2d3142" stroke-width="1.8" marker-end="url(#cd-arrow-ink)"/>
      <text x="516" y="509" fill="#4f5d75" font-size="9" font-family="'Geist','Noto Sans CJK SC',sans-serif">KV cache 交接</text>
    </svg>
  </div>
</body>
</html>
