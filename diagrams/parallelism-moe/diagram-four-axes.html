<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Four axes of parallelism</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#f5f5f5}.frame{width:1000px}svg{width:100%;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="48" y="42" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.18em">MODEL EXECUTOR · 切哪一维</text>
      <text x="48" y="76" fill="#2d3142" font-size="26" font-family="'Instrument Serif','Noto Serif CJK SC',serif">同一份模型，四种切开的方式</text>
      <text x="48" y="102" fill="#7a8399" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">张量 / 流水线 / 数据 / 专家 —— 切的不是同一维</text>

      <!-- TP -->
      <rect x="48" y="128" width="440" height="196" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
      <rect x="64" y="144" width="52" height="18" rx="3" fill="transparent" stroke="#eb6c36"/>
      <text x="90" y="157" fill="#eb6c36" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle" letter-spacing="0.12em">TP</text>
      <text x="128" y="158" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">张量并行 · Tensor Parallel</text>
      <text x="64" y="186" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">切 hidden / 权重矩阵的列或行。一层横着切开，每张卡算一块。</text>
      <g font-family="'Geist Mono','Noto Sans CJK SC',monospace" font-size="10" text-anchor="middle">
        <rect x="64" y="208" width="88" height="78" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36"/>
        <text x="108" y="242" fill="#2d3142" font-size="12" font-weight="600">GPU 0</text>
        <text x="108" y="260" fill="#7a8399">W[:, 0:d/4]</text>
        <rect x="164" y="208" width="88" height="78" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36"/>
        <text x="208" y="242" fill="#2d3142" font-size="12" font-weight="600">GPU 1</text>
        <text x="208" y="260" fill="#7a8399">W[:, d/4:d/2]</text>
        <rect x="264" y="208" width="88" height="78" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36"/>
        <text x="308" y="242" fill="#2d3142" font-size="12" font-weight="600">GPU 2</text>
        <text x="308" y="260" fill="#7a8399">W[:, d/2:3d/4]</text>
        <rect x="364" y="208" width="88" height="78" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36"/>
        <text x="408" y="242" fill="#2d3142" font-size="12" font-weight="600">GPU 3</text>
        <text x="408" y="260" fill="#7a8399">W[:, 3d/4:d]</text>
      </g>
      <text x="64" y="308" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">通信：层内 all-reduce，最好停在 NVLink 域里</text>

      <!-- PP -->
      <rect x="512" y="128" width="440" height="196" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
      <rect x="528" y="144" width="52" height="18" rx="3" fill="transparent" stroke="#4f5d75"/>
      <text x="554" y="157" fill="#4f5d75" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle" letter-spacing="0.12em">PP</text>
      <text x="592" y="158" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">流水线并行 · Pipeline Parallel</text>
      <text x="528" y="186" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">切 layers。像流水线车间，激活沿阶段往下传。</text>
      <g font-family="'Geist Mono','Noto Sans CJK SC',monospace" font-size="10" text-anchor="middle">
        <rect x="528" y="208" width="96" height="78" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
        <text x="576" y="238" fill="#2d3142" font-size="12" font-weight="600">阶段 0</text>
        <text x="576" y="258" fill="#7a8399">L0 – L7</text>
        <rect x="636" y="208" width="96" height="78" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
        <text x="684" y="238" fill="#2d3142" font-size="12" font-weight="600">阶段 1</text>
        <text x="684" y="258" fill="#7a8399">L8 – L15</text>
        <rect x="744" y="208" width="96" height="78" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
        <text x="792" y="238" fill="#2d3142" font-size="12" font-weight="600">阶段 2</text>
        <text x="792" y="258" fill="#7a8399">L16 – L23</text>
        <rect x="852" y="208" width="80" height="78" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
        <text x="892" y="238" fill="#2d3142" font-size="12" font-weight="600">阶段 3</text>
        <text x="892" y="258" fill="#7a8399">L24 – L31</text>
      </g>
      <text x="528" y="308" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">通信：阶段边界点对点；气泡 ≈ (p−1)/(m+p−1)</text>

      <!-- DP -->
      <rect x="48" y="344" width="440" height="196" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
      <rect x="64" y="360" width="52" height="18" rx="3" fill="transparent" stroke="#4f5d75"/>
      <text x="90" y="373" fill="#4f5d75" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle" letter-spacing="0.12em">DP</text>
      <text x="128" y="374" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">数据并行 · Data Parallel</text>
      <text x="64" y="402" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">切 batch。每张卡一份完整（或 TP 后的）副本，各算各的请求。</text>
      <g font-family="'Geist Mono','Noto Sans CJK SC',monospace" font-size="10" text-anchor="middle">
        <rect x="64" y="424" width="88" height="72" rx="6" fill="rgba(79,93,117,0.08)" stroke="rgba(45,49,66,0.28)"/>
        <text x="108" y="454" fill="#2d3142" font-size="12" font-weight="600">副本 0</text>
        <text x="108" y="472" fill="#7a8399">请求 A</text>
        <rect x="164" y="424" width="88" height="72" rx="6" fill="rgba(79,93,117,0.08)" stroke="rgba(45,49,66,0.28)"/>
        <text x="208" y="454" fill="#2d3142" font-size="12" font-weight="600">副本 1</text>
        <text x="208" y="472" fill="#7a8399">请求 B</text>
        <rect x="264" y="424" width="88" height="72" rx="6" fill="rgba(79,93,117,0.08)" stroke="rgba(45,49,66,0.28)"/>
        <text x="308" y="454" fill="#2d3142" font-size="12" font-weight="600">副本 2</text>
        <text x="308" y="472" fill="#7a8399">请求 C</text>
        <rect x="364" y="424" width="88" height="72" rx="6" fill="rgba(79,93,117,0.08)" stroke="rgba(45,49,66,0.28)"/>
        <text x="408" y="454" fill="#2d3142" font-size="12" font-weight="600">副本 3</text>
        <text x="408" y="472" fill="#7a8399">请求 D</text>
      </g>
      <text x="64" y="520" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">推理里通常不梯度同步；MoE 下会变成 DP Attention</text>

      <!-- EP -->
      <rect x="512" y="344" width="440" height="196" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
      <rect x="528" y="360" width="52" height="18" rx="3" fill="transparent" stroke="#eb6c36"/>
      <text x="554" y="373" fill="#eb6c36" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle" letter-spacing="0.12em">EP</text>
      <text x="592" y="374" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">专家并行 · Expert Parallel</text>
      <text x="528" y="402" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">切 experts。每个专家住在某张卡上，token 按路由飞过去。</text>
      <g font-family="'Geist Mono','Noto Sans CJK SC',monospace" font-size="10" text-anchor="middle">
        <rect x="528" y="424" width="96" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
        <text x="576" y="454" fill="#2d3142" font-size="12" font-weight="600">GPU 0</text>
        <text x="576" y="472" fill="#7a8399">E0 – E7</text>
        <rect x="636" y="424" width="96" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
        <text x="684" y="454" fill="#2d3142" font-size="12" font-weight="600">GPU 1</text>
        <text x="684" y="472" fill="#7a8399">E8 – E15</text>
        <rect x="744" y="424" width="96" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
        <text x="792" y="454" fill="#2d3142" font-size="12" font-weight="600">GPU 2</text>
        <text x="792" y="472" fill="#7a8399">E16 – E23</text>
        <rect x="852" y="424" width="80" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
        <text x="892" y="454" fill="#2d3142" font-size="12" font-weight="600">GPU 3</text>
        <text x="892" y="472" fill="#7a8399">E24 – …</text>
      </g>
      <text x="528" y="520" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">通信：dispatch / combine 的 all-to-all，比 TP 更散</text>

      <text x="500" y="562" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">四种可以叠：DeepSeek-V3 的 attention 走 TP+SP+DP，MoE 走 EP</text>
    </svg>
  </div>
</body>
</html>
