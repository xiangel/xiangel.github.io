<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Six axes of parallelism</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#f5f5f5}.frame{width:1000px}svg{width:100%;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="40" y="40" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.16em">MODEL EXECUTOR · 六刀全景</text>
      <text x="40" y="74" fill="#2d3142" font-size="26" font-family="'Instrument Serif','Noto Serif CJK SC',serif">名字都叫并行，切的不是同一维</text>
      <text x="40" y="100" fill="#7a8399" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">本篇只摊推理这六刀。训练同名刀收到文末，这里不展开。</text>

      <!-- row 1 -->
      <rect x="40" y="124" width="292" height="196" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
      <rect x="56" y="140" width="44" height="16" rx="2" fill="transparent" stroke="#eb6c36"/>
      <text x="78" y="152" fill="#eb6c36" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle" letter-spacing="0.10em">TP</text>
      <text x="110" y="153" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">张量并行</text>
      <text x="56" y="180" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">切 hidden / 权重矩阵</text>
      <text x="56" y="202" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">一层横着切开，含词表切分</text>
      <text x="56" y="230" fill="#2d3142" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace">通信 · 层内 all-reduce</text>
      <text x="56" y="252" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">怕：跨节点、小消息延迟</text>
      <text x="56" y="292" fill="#eb6c36" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">问题：一张卡装不下</text>

      <rect x="354" y="124" width="292" height="196" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
      <rect x="370" y="140" width="44" height="16" rx="2" fill="transparent" stroke="#4f5d75"/>
      <text x="392" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle" letter-spacing="0.10em">PP</text>
      <text x="424" y="153" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">流水线并行</text>
      <text x="370" y="180" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">切 layers / 模型深度</text>
      <text x="370" y="202" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">连续若干层交给一个阶段</text>
      <text x="370" y="230" fill="#2d3142" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace">通信 · 阶段边界点对点</text>
      <text x="370" y="252" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">怕：气泡、batch=1 灌不满</text>
      <text x="370" y="292" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">问题：出节点做 TP 太贵</text>

      <rect x="668" y="124" width="292" height="196" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
      <rect x="684" y="140" width="44" height="16" rx="2" fill="transparent" stroke="#4f5d75"/>
      <text x="706" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle" letter-spacing="0.10em">DP</text>
      <text x="738" y="153" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">数据并行</text>
      <text x="684" y="180" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">切 batch / 请求</text>
      <text x="684" y="202" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">推理不梯度同步；含 DP Attention</text>
      <text x="684" y="230" fill="#2d3142" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace">通信 · 推理里通常没有</text>
      <text x="684" y="252" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">怕：前缀缓存被摊薄</text>
      <text x="684" y="292" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">问题：一份模型吞吐不够</text>

      <!-- row 2 -->
      <rect x="40" y="340" width="292" height="196" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
      <rect x="56" y="356" width="44" height="16" rx="2" fill="transparent" stroke="#eb6c36"/>
      <text x="78" y="368" fill="#eb6c36" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle" letter-spacing="0.10em">SP</text>
      <text x="110" y="369" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">序列并行</text>
      <text x="56" y="396" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">切 LayerNorm / Dropout 的序列</text>
      <text x="56" y="418" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">TP 的伴生，不是切注意力</text>
      <text x="56" y="446" fill="#2d3142" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace">通信 · all-gather / RS</text>
      <text x="56" y="468" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">怕：和 Ulysses / CP 同名混淆</text>
      <text x="56" y="508" fill="#eb6c36" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">问题：TP 后激活显存仍爆</text>

      <rect x="354" y="340" width="292" height="196" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
      <rect x="370" y="356" width="44" height="16" rx="2" fill="transparent" stroke="#eb6c36"/>
      <text x="392" y="368" fill="#eb6c36" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle" letter-spacing="0.10em">CP</text>
      <text x="424" y="369" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">上下文并行</text>
      <text x="370" y="396" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">切序列，含注意力本身</text>
      <text x="370" y="418" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">Ring / Ulysses；推理还有 DCP</text>
      <text x="370" y="446" fill="#2d3142" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace">通信 · KV 环传或 A2A</text>
      <text x="370" y="468" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">怕：超长上下文把 KV 撑爆</text>
      <text x="370" y="508" fill="#eb6c36" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">问题：序列太长，TP 切不够</text>

      <rect x="668" y="340" width="292" height="196" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
      <rect x="684" y="356" width="44" height="16" rx="2" fill="transparent" stroke="#eb6c36"/>
      <text x="706" y="368" fill="#eb6c36" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle" letter-spacing="0.10em">EP</text>
      <text x="738" y="369" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">专家并行</text>
      <text x="684" y="396" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">切 MoE 的 experts</text>
      <text x="684" y="418" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">token 按路由飞向专家所在卡</text>
      <text x="684" y="446" fill="#2d3142" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace">通信 · dispatch / combine</text>
      <text x="684" y="468" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">怕：热点专家、两种内核</text>
      <text x="684" y="508" fill="#eb6c36" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">问题：稀疏 FFN 不值得切 TP</text>

      <rect x="40" y="556" width="920" height="132" rx="10" fill="rgba(235,108,54,0.06)" stroke="#eb6c36"/>
      <text x="56" y="586" fill="#eb6c36" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.10em">不要和这六刀混在一起</text>
      <text x="56" y="614" fill="#2d3142" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">Megatron SP ≠ DeepSpeed Ulysses ≠ Ring CP。前一个只切 LayerNorm；后两个才切注意力。</text>
      <text x="56" y="638" fill="#2d3142" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">再往外一刀：MegaScale-Infer 把 attention 和 FFN 拆到两类机器，是 EP 之后的分离，不是第七种切维。</text>
      <text x="56" y="662" fill="#4f5d75" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">训练还有 ZeRO / VPP / DualPipe，机制不在本篇展开。</text>
    </svg>
  </div>
</body>
</html>
