<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interconnect determines transfer cost · Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; }
    body { background: var(--color-paper); }
    .frame { width: 1000px; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ic-title ic-desc">
      <title id="ic-title">How the KV actually moves: fabric tiers, point-to-point vs pooled store</title>
      <desc id="ic-desc">Left: an interconnect ladder where a faster fabric means a cheaper KV handoff — NVLink inside a node at hundreds of GB/s, InfiniBand or RoCE RDMA at tens of GB/s, PCIe at about ten GB/s, and TCP or Ethernet at about one GB/s. Right: two ways to move or keep KV — point-to-point VRAM to VRAM between prefill and decode, or a pooled KV store on CPU, DRAM, and SSD that both sides read and write.</desc>
      <defs>
        <pattern id="ic-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="ic-arrow" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2d3142"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#ic-dots)" opacity="0.55"/>

      <!-- Heading -->
      <text x="60" y="46" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" letter-spacing="0.18em">MOVING THE KV CACHE</text>
      <text x="60" y="78" fill="#2d3142" font-size="26" font-family="'Instrument Serif', serif">Fabric tiers, point-to-point vs pooled store</text>

      <!-- Left column title -->
      <text x="60" y="150" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="600">Interconnect determines transfer cost</text>
      <text x="60" y="170" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">faster fabric → cheaper KV handoff</text>

      <!-- NVLink (focal / accent) -->
      <text x="60" y="212" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600">NVLink (intra-node)</text>
      <rect x="60" y="218" width="340" height="30" rx="4" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="412" y="238" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">~100s GB/s</text>

      <!-- InfiniBand -->
      <text x="60" y="278" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600">InfiniBand / RoCE · RDMA</text>
      <rect x="60" y="284" width="212" height="30" rx="4" fill="rgba(79,93,117,0.12)" stroke="#4f5d75" stroke-width="1"/>
      <text x="412" y="304" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">~10s GB/s</text>

      <!-- PCIe -->
      <text x="60" y="344" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600">PCIe</text>
      <rect x="60" y="350" width="136" height="30" rx="4" fill="rgba(79,93,117,0.12)" stroke="#4f5d75" stroke-width="1"/>
      <text x="412" y="370" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">~10 GB/s</text>

      <!-- TCP -->
      <text x="60" y="410" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600">TCP / Ethernet</text>
      <rect x="60" y="416" width="68" height="30" rx="4" fill="rgba(79,93,117,0.12)" stroke="#4f5d75" stroke-width="1"/>
      <text x="412" y="436" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">~1 GB/s</text>

      <!-- divider -->
      <line x1="500" y1="140" x2="500" y2="450" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- Right column title -->
      <text x="540" y="150" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="600">Two ways to move / keep KV</text>

      <!-- P2P scenario -->
      <text x="748" y="210" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Point-to-point (P2P)</text>
      <rect x="540" y="226" width="112" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="596" y="258" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">prefill</text>
      <rect x="844" y="226" width="112" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
      <text x="900" y="258" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">decode</text>
      <line x1="652" y1="254" x2="844" y2="254" stroke="#2d3142" stroke-width="1.8" marker-end="url(#ic-arrow)"/>
      <rect x="694" y="234" width="108" height="14" rx="2" fill="#f5f5f5"/>
      <text x="748" y="244" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">VRAM → VRAM</text>
      <text x="748" y="300" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DistServe / Dynamo / NIXL</text>

      <!-- pooled scenario -->
      <text x="748" y="346" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Pooled KV store</text>
      <rect x="540" y="360" width="112" height="52" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="596" y="390" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">prefill</text>
      <rect x="844" y="360" width="112" height="52" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
      <text x="900" y="390" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">decode</text>
      <rect x="684" y="416" width="128" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="748" y="436" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">KV store</text>
      <text x="748" y="452" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">CPU / DRAM / SSD</text>
      <path d="M 620,412 L 690,432" fill="none" stroke="#2d3142" stroke-width="1.6" marker-end="url(#ic-arrow)"/>
      <path d="M 806,432 L 876,412" fill="none" stroke="#2d3142" stroke-width="1.6" marker-end="url(#ic-arrow)"/>
      <text x="748" y="404" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Mooncake Store</text>

      <!-- Legend -->
      <line x1="60" y1="486" x2="960" y2="486" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="502" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="60" y="516" width="16" height="10" rx="2" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="84" y="525" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">fastest fabric / prefill</text>
      <rect x="260" y="516" width="16" height="10" rx="2" fill="rgba(79,93,117,0.12)" stroke="#4f5d75" stroke-width="1"/>
      <text x="284" y="525" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">slower fabric / decode</text>
      <rect x="460" y="516" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="484" y="525" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">pooled KV store</text>
    </svg>
  </div>
</body>
</html>
