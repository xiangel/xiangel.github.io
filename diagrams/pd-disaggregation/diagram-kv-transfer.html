<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serialized vs layer-wise KV transfer · Timeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; }
    body { background: var(--color-paper); }
    .frame { width: 1000px; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kv-title kv-desc">
      <title id="kv-title">The new cost of splitting: moving the KV cache — and how to hide it</title>
      <desc id="kv-desc">Top: serialized transfer computes all prefill layers, then transfers the whole KV cache, while decode waits — adding extra TTFT. Bottom: layer-wise or chunked transfer sends each layer's KV as soon as it is computed, overlapping transfer with the compute of the next layer, so decode can start almost immediately and the handoff is nearly free.</desc>
      <defs>
        <pattern id="kv-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="kv-arrow" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2d3142"/></marker>
        <marker id="kv-arrow-s" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#kv-dots)" opacity="0.55"/>

      <!-- Heading -->
      <text x="60" y="46" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" letter-spacing="0.18em">THE NEW COST OF SPLITTING</text>
      <text x="60" y="78" fill="#2d3142" font-size="26" font-family="'Instrument Serif', serif">Moving the KV cache — and how to hide it</text>

      <!-- Row 1: serialized -->
      <text x="60" y="140" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="600">Serialized transfer <tspan fill="#4f5d75" font-weight="400">(simple, but adds a stall)</tspan></text>
      <rect x="60" y="156" width="440" height="52" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
      <text x="280" y="187" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">prefill ALL layers</text>
      <rect x="516" y="156" width="252" height="52" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="642" y="187" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">THEN transfer KV</text>
      <rect x="784" y="156" width="176" height="52" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="872" y="187" fill="#7a8399" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">decode waits</text>
      <text x="60" y="234" fill="#eb6c36" font-size="11" font-family="'Geist', sans-serif">decode can't start until the whole KV has moved  →  extra TTFT</text>

      <!-- Row 2: layer-wise -->
      <text x="60" y="290" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="600">Layer-wise / chunked transfer <tspan fill="#4f5d75" font-weight="400">(overlap transfer with compute)</tspan></text>
      <text x="60" y="316" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">COMPUTE LAYER L</text>

      <!-- overlap arrows (behind) -->
      <line x1="120" y1="366" x2="152" y2="382" stroke="#7a8399" stroke-width="1" marker-end="url(#kv-arrow-s)"/>
      <line x1="208" y1="366" x2="240" y2="382" stroke="#7a8399" stroke-width="1" marker-end="url(#kv-arrow-s)"/>
      <line x1="296" y1="366" x2="328" y2="382" stroke="#7a8399" stroke-width="1" marker-end="url(#kv-arrow-s)"/>
      <line x1="384" y1="366" x2="416" y2="382" stroke="#7a8399" stroke-width="1" marker-end="url(#kv-arrow-s)"/>
      <line x1="472" y1="366" x2="504" y2="382" stroke="#7a8399" stroke-width="1" marker-end="url(#kv-arrow-s)"/>

      <!-- compute layer boxes (accent) -->
      <g font-family="'Geist Mono', monospace" font-size="11" text-anchor="middle">
        <rect x="60"  y="324" width="76" height="44" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="98"  y="350" fill="#2d3142">L1</text>
        <rect x="148" y="324" width="76" height="44" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="186" y="350" fill="#2d3142">L2</text>
        <rect x="236" y="324" width="76" height="44" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="274" y="350" fill="#2d3142">L3</text>
        <rect x="324" y="324" width="76" height="44" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="362" y="350" fill="#2d3142">L4</text>
        <rect x="412" y="324" width="76" height="44" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="450" y="350" fill="#2d3142">L5</text>
        <rect x="500" y="324" width="76" height="44" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="538" y="350" fill="#2d3142">L6</text>
      </g>

      <!-- xfer boxes (store / ink) -->
      <g font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">
        <rect x="60"  y="384" width="76" height="40" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="98"  y="408" fill="#4f5d75">xfer</text>
        <rect x="148" y="384" width="76" height="40" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="186" y="408" fill="#4f5d75">xfer</text>
        <rect x="236" y="384" width="76" height="40" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="274" y="408" fill="#4f5d75">xfer</text>
        <rect x="324" y="384" width="76" height="40" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="362" y="408" fill="#4f5d75">xfer</text>
        <rect x="412" y="384" width="76" height="40" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="450" y="408" fill="#4f5d75">xfer</text>
        <rect x="500" y="384" width="76" height="40" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="538" y="408" fill="#4f5d75">xfer</text>
      </g>

      <!-- right side explanation + decode -->
      <text x="620" y="338" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">as soon as layer L's KV is ready,</text>
      <text x="620" y="356" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">send it while computing L+1</text>
      <rect x="620" y="384" width="180" height="40" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
      <text x="710" y="408" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">decode starts ~now</text>

      <text x="60" y="456" fill="#eb6c36" font-size="11" font-family="'Geist', sans-serif" font-weight="600">transfer hides behind compute  →  handoff nearly free</text>

      <!-- Legend -->
      <line x1="60" y1="490" x2="960" y2="490" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="506" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="60" y="520" width="16" height="10" rx="2" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
      <text x="84" y="529" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">prefill compute (layer L)</text>
      <rect x="280" y="520" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="304" y="529" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">KV transfer (xfer)</text>
      <rect x="470" y="520" width="16" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
      <text x="494" y="529" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">decode</text>
    </svg>
  </div>
</body>
</html>
