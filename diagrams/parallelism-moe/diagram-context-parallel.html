<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Context parallel Ring vs Ulysses vs DCP</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#f5f5f5}.frame{width:1000px}svg{width:100%;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="ar" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2d3142"/></marker>
        <marker id="arA" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="40" y="40" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.16em">CONTEXT PARALLEL · RING / ULYSSES / DCP</text>
      <text x="40" y="74" fill="#2d3142" font-size="26" font-family="'Instrument Serif','Noto Serif CJK SC',serif">序列太长，就按 token 切开，再把 KV 转一圈</text>
      <text x="40" y="100" fill="#7a8399" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">和 Megatron SP 不同：这里切的是注意力本身，每张卡只看见一段序列</text>

      <!-- Ring CP -->
      <rect x="40" y="124" width="460" height="250" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
      <rect x="56" y="140" width="88" height="16" rx="2" fill="transparent" stroke="#eb6c36"/>
      <text x="100" y="152" fill="#eb6c36" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle" letter-spacing="0.08em">RING CP</text>
      <text x="56" y="180" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">环形传 KV · Megatron 默认</text>
      <g font-family="'Geist Mono','Noto Sans CJK SC',monospace" font-size="10" text-anchor="middle">
        <rect x="56" y="200" width="200" height="56" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36"/>
        <text x="156" y="224" fill="#2d3142" font-size="12" font-weight="600">GPU 0 · token 0–3</text>
        <text x="156" y="242" fill="#7a8399">本地 Q · 先算本地 KV</text>
        <rect x="280" y="200" width="200" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
        <text x="380" y="224" fill="#2d3142" font-size="12" font-weight="600">GPU 1 · token 4–7</text>
        <text x="380" y="242" fill="#7a8399">本地 Q · 先算本地 KV</text>
      </g>
      <path d="M256 268 C256 292, 280 292, 280 268" fill="none" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arA)"/>
      <path d="M280 200 C280 176, 256 176, 256 200" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#ar)"/>
      <text x="270" y="310" fill="#2d3142" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">把对方的 KV 环传过来，和自己的 Q 做完注意力</text>
      <text x="270" y="332" fill="#7a8399" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">体积 ≈ (1 − 1/C) · S · d_kv　可与计算重叠</text>
      <text x="270" y="354" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">GQA / MLA 让 KV 头很少，这刀更划算</text>

      <!-- Ulysses -->
      <rect x="520" y="124" width="440" height="250" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
      <rect x="536" y="140" width="100" height="16" rx="2" fill="transparent" stroke="#4f5d75"/>
      <text x="586" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle" letter-spacing="0.08em">ULYSSES</text>
      <text x="536" y="180" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">两次 all-to-all 换轴</text>
      <text x="536" y="208" fill="#4f5d75" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">先按序列切开拿到 QKV，再 all-to-all</text>
      <text x="536" y="230" fill="#4f5d75" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">换成按注意力头切开——每张卡拿</text>
      <text x="536" y="252" fill="#4f5d75" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">完整序列、但只有一部分头。</text>
      <text x="536" y="284" fill="#2d3142" font-size="12" font-family="'Geist Mono','Noto Sans CJK SC',monospace">体积 ≈ S · hidden / C　一次集体通信</text>
      <text x="536" y="308" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">约束：头数 ≥ CP 度，NVLink 上往往更快</text>
      <text x="536" y="332" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">Megatron 的 a2a / a2a+p2p 就是这条</text>
      <text x="536" y="354" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">跨节点则常退回 Ring P2P</text>

      <!-- DCP -->
      <rect x="40" y="394" width="920" height="170" rx="10" fill="rgba(235,108,54,0.06)" stroke="#eb6c36"/>
      <text x="56" y="424" fill="#eb6c36" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.10em">推理侧还要再拆 · DCP / PCP</text>
      <text x="56" y="452" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">Decode Context Parallel：不增加 GPU 数，只在现有 TP 组里按 token 交错切 KV</text>
      <g font-family="'Geist Mono','Noto Sans CJK SC',monospace" font-size="11" text-anchor="middle">
        <rect x="56" y="468" width="200" height="44" rx="6" fill="#ffffff" stroke="#eb6c36"/>
        <text x="156" y="496" fill="#2d3142">DCP0 · KV 0,2,4,6…</text>
        <rect x="272" y="468" width="200" height="44" rx="6" fill="#ffffff" stroke="#4f5d75"/>
        <text x="372" y="496" fill="#2d3142">DCP1 · KV 1,3,5,7…</text>
      </g>
      <text x="500" y="486" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">GQA 头不够切时，TP 会复制 KV；DCP 把这段复制砍掉。</text>
      <text x="500" y="506" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">vLLM：`--decode-context-parallel-size`，上界约 tp_size / KV 头数。</text>
      <text x="56" y="540" fill="#2d3142" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">Prefill Context Parallel（PCP）才真正加卡：一条长 prompt 按序列切开，用来压 TTFT。和 DCP 正交，不要共用一个开关。</text>
    </svg>
  </div>
</body>
</html>
