<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Chunked prefill</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#f5f5f5}.frame{width:1000px}svg{width:100%;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="d2" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#d2)" opacity="0.55"/>

      <text x="60" y="46" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.18em">CHUNKED PREFILL · SARATHI-SERVE</text>
      <text x="60" y="80" fill="#2d3142" font-size="24" font-family="'Instrument Serif','Noto Serif CJK SC',serif">别让一个长 prefill 拖垮整轮 decode</text>

      <!-- Lane A -->
      <text x="60" y="128" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.12em">A · NAÏVE 混批</text>
      <g font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">
        <rect x="60" y="150" width="56" height="44" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
        <text x="88" y="177" fill="#2d3142" font-size="11" font-weight="600">decode</text>
        <rect x="128" y="150" width="56" height="44" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
        <text x="156" y="177" fill="#2d3142" font-size="11" font-weight="600">decode</text>
        <rect x="196" y="146" width="500" height="52" rx="8" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.4"/>
        <text x="446" y="168" fill="#2d3142" font-size="13" font-weight="600">PREFILL（整段 prompt）</text>
        <text x="446" y="186" fill="#eb6c36" font-size="10">独占一轮 · 所有 decode 一起卡顿</text>
        <rect x="708" y="150" width="56" height="44" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
        <text x="736" y="177" fill="#2d3142" font-size="11" font-weight="600">decode</text>
        <rect x="776" y="150" width="56" height="44" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
        <text x="804" y="177" fill="#2d3142" font-size="11" font-weight="600">decode</text>
      </g>
      <text x="446" y="220" fill="#eb6c36" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">decode 卡顿（TBT 尖刺）</text>

      <line x1="60" y1="248" x2="940" y2="248" stroke="rgba(45,49,66,0.10)"/>

      <!-- Lane B -->
      <text x="60" y="286" fill="#eb6c36" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.12em">B · CHUNKED PREFILL + 无停顿调度</text>
      <text x="60" y="308" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">每轮形状接近一致 · 总量 ≤ token 预算 τ</text>

      <!-- dashed budget line -->
      <line x1="60" y1="336" x2="820" y2="336" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="828" y="340" fill="#eb6c36" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace">token 预算 τ</text>

      <g font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">
        <!-- iter 1 -->
        <rect x="60" y="352" width="88" height="36" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36"/>
        <text x="104" y="375" fill="#2d3142" font-size="12" font-weight="600">P1</text>
        <rect x="60" y="396" width="88" height="36" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
        <text x="104" y="419" fill="#2d3142" font-size="12" font-weight="600">decode</text>
        <text x="104" y="452" fill="#7a8399" font-size="9">≤ 预算</text>
        <!-- iter 2 -->
        <rect x="168" y="352" width="88" height="36" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36"/>
        <text x="212" y="375" fill="#2d3142" font-size="12" font-weight="600">P2</text>
        <rect x="168" y="396" width="88" height="36" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
        <text x="212" y="419" fill="#2d3142" font-size="12" font-weight="600">decode</text>
        <text x="212" y="452" fill="#7a8399" font-size="9">≤ 预算</text>
        <!-- iter 3 -->
        <rect x="276" y="352" width="88" height="36" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36"/>
        <text x="320" y="375" fill="#2d3142" font-size="12" font-weight="600">P3</text>
        <rect x="276" y="396" width="88" height="36" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
        <text x="320" y="419" fill="#2d3142" font-size="12" font-weight="600">decode</text>
        <text x="320" y="452" fill="#7a8399" font-size="9">≤ 预算</text>
        <!-- iter 4 decode only -->
        <rect x="384" y="396" width="88" height="36" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
        <text x="428" y="419" fill="#2d3142" font-size="12" font-weight="600">decode</text>
        <text x="428" y="452" fill="#7a8399" font-size="9">≤ 预算</text>
        <!-- iter 5 decode only -->
        <rect x="492" y="396" width="88" height="36" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/>
        <text x="536" y="419" fill="#2d3142" font-size="12" font-weight="600">decode</text>
        <text x="536" y="452" fill="#7a8399" font-size="9">≤ 预算</text>
      </g>
      <text x="640" y="374" fill="#eb6c36" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">prefill 切成预算大小的块</text>
      <text x="640" y="418" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">decode 不再卡顿</text>

      <text x="60" y="508" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">先把正在跑的 decode 塞进本轮，再用剩余预算塞一块 prefill —— token budget 就是 LLM 版的时间片。</text>
    </svg>
  </div>
</body>
</html>
