<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Pipeline parallel bubble</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#f5f5f5}.frame{width:1000px}svg{width:100%;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <pattern id="bubble" width="8" height="8" patternUnits="userSpaceOnUse">
          <path d="M0 8 L8 0" stroke="rgba(235,108,54,0.35)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="48" y="42" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.18em">PIPELINE PARALLEL · BUBBLE</text>
      <text x="48" y="76" fill="#2d3142" font-size="26" font-family="'Instrument Serif','Noto Serif CJK SC',serif">流水线要灌满，气泡才会瘪下去</text>
      <text x="48" y="102" fill="#7a8399" font-size="13" font-family="'Geist','Noto Sans CJK SC',sans-serif">p = 4 个阶段，m = 8 个微批次。斜线格是空转的气泡。</text>

      <!-- column headers: time / microbatch slots -->
      <text x="168" y="138" fill="#4f5d75" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.08em">时间 →</text>
      <g font-family="'Geist Mono','Noto Sans CJK SC',monospace" font-size="9" fill="#7a8399" text-anchor="middle">
        <text x="196" y="138">t0</text>
        <text x="260" y="138">t1</text>
        <text x="324" y="138">t2</text>
        <text x="388" y="138">t3</text>
        <text x="452" y="138">t4</text>
        <text x="516" y="138">t5</text>
        <text x="580" y="138">t6</text>
        <text x="644" y="138">t7</text>
        <text x="708" y="138">t8</text>
        <text x="772" y="138">t9</text>
        <text x="836" y="138">t10</text>
      </g>

      <!-- Stage rows. Each cell 60x48, start x=164 -->
      <!-- colors for microbatches 1-8 -->
      <!-- Stage 0: m1..m8 then idle idle idle -->
      <text x="48" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">阶段 0</text>
      <text x="48" y="202" fill="#7a8399" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace">L0–L7</text>
      <g font-family="'Geist Mono','Noto Sans CJK SC',monospace" font-size="11" font-weight="600" text-anchor="middle">
        <rect x="164" y="160" width="60" height="48" rx="4" fill="rgba(235,108,54,0.18)" stroke="#eb6c36"/><text x="194" y="189" fill="#2d3142">m1</text>
        <rect x="228" y="160" width="60" height="48" rx="4" fill="rgba(235,108,54,0.18)" stroke="#eb6c36"/><text x="258" y="189" fill="#2d3142">m2</text>
        <rect x="292" y="160" width="60" height="48" rx="4" fill="rgba(235,108,54,0.18)" stroke="#eb6c36"/><text x="322" y="189" fill="#2d3142">m3</text>
        <rect x="356" y="160" width="60" height="48" rx="4" fill="rgba(235,108,54,0.18)" stroke="#eb6c36"/><text x="386" y="189" fill="#2d3142">m4</text>
        <rect x="420" y="160" width="60" height="48" rx="4" fill="rgba(235,108,54,0.18)" stroke="#eb6c36"/><text x="450" y="189" fill="#2d3142">m5</text>
        <rect x="484" y="160" width="60" height="48" rx="4" fill="rgba(235,108,54,0.18)" stroke="#eb6c36"/><text x="514" y="189" fill="#2d3142">m6</text>
        <rect x="548" y="160" width="60" height="48" rx="4" fill="rgba(235,108,54,0.18)" stroke="#eb6c36"/><text x="578" y="189" fill="#2d3142">m7</text>
        <rect x="612" y="160" width="60" height="48" rx="4" fill="rgba(235,108,54,0.18)" stroke="#eb6c36"/><text x="642" y="189" fill="#2d3142">m8</text>
        <rect x="676" y="160" width="60" height="48" rx="4" fill="url(#bubble)" stroke="rgba(235,108,54,0.45)"/>
        <rect x="740" y="160" width="60" height="48" rx="4" fill="url(#bubble)" stroke="rgba(235,108,54,0.45)"/>
        <rect x="804" y="160" width="60" height="48" rx="4" fill="url(#bubble)" stroke="rgba(235,108,54,0.45)"/>
      </g>

      <text x="48" y="250" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">阶段 1</text>
      <text x="48" y="266" fill="#7a8399" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace">L8–L15</text>
      <g font-family="'Geist Mono','Noto Sans CJK SC',monospace" font-size="11" font-weight="600" text-anchor="middle">
        <rect x="164" y="224" width="60" height="48" rx="4" fill="url(#bubble)" stroke="rgba(235,108,54,0.45)"/>
        <rect x="228" y="224" width="60" height="48" rx="4" fill="rgba(79,93,117,0.14)" stroke="#4f5d75"/><text x="258" y="253" fill="#2d3142">m1</text>
        <rect x="292" y="224" width="60" height="48" rx="4" fill="rgba(79,93,117,0.14)" stroke="#4f5d75"/><text x="322" y="253" fill="#2d3142">m2</text>
        <rect x="356" y="224" width="60" height="48" rx="4" fill="rgba(79,93,117,0.14)" stroke="#4f5d75"/><text x="386" y="253" fill="#2d3142">m3</text>
        <rect x="420" y="224" width="60" height="48" rx="4" fill="rgba(79,93,117,0.14)" stroke="#4f5d75"/><text x="450" y="253" fill="#2d3142">m4</text>
        <rect x="484" y="224" width="60" height="48" rx="4" fill="rgba(79,93,117,0.14)" stroke="#4f5d75"/><text x="514" y="253" fill="#2d3142">m5</text>
        <rect x="548" y="224" width="60" height="48" rx="4" fill="rgba(79,93,117,0.14)" stroke="#4f5d75"/><text x="578" y="253" fill="#2d3142">m6</text>
        <rect x="612" y="224" width="60" height="48" rx="4" fill="rgba(79,93,117,0.14)" stroke="#4f5d75"/><text x="642" y="253" fill="#2d3142">m7</text>
        <rect x="676" y="224" width="60" height="48" rx="4" fill="rgba(79,93,117,0.14)" stroke="#4f5d75"/><text x="706" y="253" fill="#2d3142">m8</text>
        <rect x="740" y="224" width="60" height="48" rx="4" fill="url(#bubble)" stroke="rgba(235,108,54,0.45)"/>
        <rect x="804" y="224" width="60" height="48" rx="4" fill="url(#bubble)" stroke="rgba(235,108,54,0.45)"/>
      </g>

      <text x="48" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">阶段 2</text>
      <text x="48" y="330" fill="#7a8399" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace">L16–L23</text>
      <g font-family="'Geist Mono','Noto Sans CJK SC',monospace" font-size="11" font-weight="600" text-anchor="middle">
        <rect x="164" y="288" width="60" height="48" rx="4" fill="url(#bubble)" stroke="rgba(235,108,54,0.45)"/>
        <rect x="228" y="288" width="60" height="48" rx="4" fill="url(#bubble)" stroke="rgba(235,108,54,0.45)"/>
        <rect x="292" y="288" width="60" height="48" rx="4" fill="rgba(79,93,117,0.14)" stroke="#4f5d75"/><text x="322" y="317" fill="#2d3142">m1</text>
        <rect x="356" y="288" width="60" height="48" rx="4" fill="rgba(79,93,117,0.14)" stroke="#4f5d75"/><text x="386" y="317" fill="#2d3142">m2</text>
        <rect x="420" y="288" width="60" height="48" rx="4" fill="rgba(79,93,117,0.14)" stroke="#4f5d75"/><text x="450" y="317" fill="#2d3142">m3</text>
        <rect x="484" y="288" width="60" height="48" rx="4" fill="rgba(79,93,117,0.14)" stroke="#4f5d75"/><text x="514" y="317" fill="#2d3142">m4</text>
        <rect x="548" y="288" width="60" height="48" rx="4" fill="rgba(79,93,117,0.14)" stroke="#4f5d75"/><text x="578" y="317" fill="#2d3142">m5</text>
        <rect x="612" y="288" width="60" height="48" rx="4" fill="rgba(79,93,117,0.14)" stroke="#4f5d75"/><text x="642" y="317" fill="#2d3142">m6</text>
        <rect x="676" y="288" width="60" height="48" rx="4" fill="rgba(79,93,117,0.14)" stroke="#4f5d75"/><text x="706" y="317" fill="#2d3142">m7</text>
        <rect x="740" y="288" width="60" height="48" rx="4" fill="rgba(79,93,117,0.14)" stroke="#4f5d75"/><text x="770" y="317" fill="#2d3142">m8</text>
        <rect x="804" y="288" width="60" height="48" rx="4" fill="url(#bubble)" stroke="rgba(235,108,54,0.45)"/>
      </g>

      <text x="48" y="378" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">阶段 3</text>
      <text x="48" y="394" fill="#7a8399" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace">L24–L31</text>
      <g font-family="'Geist Mono','Noto Sans CJK SC',monospace" font-size="11" font-weight="600" text-anchor="middle">
        <rect x="164" y="352" width="60" height="48" rx="4" fill="url(#bubble)" stroke="rgba(235,108,54,0.45)"/>
        <rect x="228" y="352" width="60" height="48" rx="4" fill="url(#bubble)" stroke="rgba(235,108,54,0.45)"/>
        <rect x="292" y="352" width="60" height="48" rx="4" fill="url(#bubble)" stroke="rgba(235,108,54,0.45)"/>
        <rect x="356" y="352" width="60" height="48" rx="4" fill="rgba(235,108,54,0.18)" stroke="#eb6c36"/><text x="386" y="381" fill="#2d3142">m1</text>
        <rect x="420" y="352" width="60" height="48" rx="4" fill="rgba(235,108,54,0.18)" stroke="#eb6c36"/><text x="450" y="381" fill="#2d3142">m2</text>
        <rect x="484" y="352" width="60" height="48" rx="4" fill="rgba(235,108,54,0.18)" stroke="#eb6c36"/><text x="514" y="381" fill="#2d3142">m3</text>
        <rect x="548" y="352" width="60" height="48" rx="4" fill="rgba(235,108,54,0.18)" stroke="#eb6c36"/><text x="578" y="381" fill="#2d3142">m4</text>
        <rect x="612" y="352" width="60" height="48" rx="4" fill="rgba(235,108,54,0.18)" stroke="#eb6c36"/><text x="642" y="381" fill="#2d3142">m5</text>
        <rect x="676" y="352" width="60" height="48" rx="4" fill="rgba(235,108,54,0.18)" stroke="#eb6c36"/><text x="706" y="381" fill="#2d3142">m6</text>
        <rect x="740" y="352" width="60" height="48" rx="4" fill="rgba(235,108,54,0.18)" stroke="#eb6c36"/><text x="770" y="381" fill="#2d3142">m7</text>
        <rect x="804" y="352" width="60" height="48" rx="4" fill="rgba(235,108,54,0.18)" stroke="#eb6c36"/><text x="834" y="381" fill="#2d3142">m8</text>
      </g>

      <!-- formula cards -->
      <rect x="48" y="424" width="430" height="84" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
      <text x="68" y="454" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">气泡比例 ≈ (p − 1) / (m + p − 1)</text>
      <text x="68" y="478" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">图中 p=4、m=8 → 气泡 3/11 ≈ 27%。m 越大，空转占比越低。</text>
      <text x="68" y="496" fill="#7a8399" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace">理想利用率 = m / (m + p − 1)</text>

      <rect x="498" y="424" width="454" height="84" rx="8" fill="rgba(235,108,54,0.06)" stroke="#eb6c36"/>
      <text x="518" y="454" fill="#eb6c36" font-size="14" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">batch = 1 时，m 灌不满</text>
      <text x="518" y="478" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">在线 decode 常常一次只推一个 token。m=1、p=8 → 利用率只剩 1/8。</text>
      <text x="518" y="496" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">这就是推理里 PP 远没有训练好用的原因。</text>
    </svg>
  </div>
</body>
</html>
