<svg xmlns="http://www.w3.org/2000/svg" width="640" height="780" viewBox="0 0 640 780" role="img" aria-label="一层 decoder 结构：归一化、因果自注意力、前馈，以及读写历史 K/V">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="640" height="780" fill="#FFFFFF"/>

  <text x="320" y="36" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#1E293B">
    一层 Decoder Block
  </text>
  <text x="320" y="58" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748B">
    因果自注意力读写历史 Key/Value · 残差连接串成生成主干
  </text>

  <g font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- Main stack -->
    <rect x="220" y="88" width="200" height="52" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="320" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#1E293B">这一层的输入 x</text>

    <line x1="320" y1="140" x2="320" y2="162" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" style="color:#334155"/>

    <rect x="240" y="164" width="160" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="320" y="191" text-anchor="middle" font-size="13" fill="#1E293B">RMSNorm</text>

    <line x1="320" y1="208" x2="320" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" style="color:#334155"/>

    <rect x="200" y="232" width="240" height="64" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="320" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C">因果自注意力</text>
    <text x="320" y="278" text-anchor="middle" font-size="11" fill="#64748B">Causal Self-Attention</text>

    <line x1="320" y1="296" x2="320" y2="318" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" style="color:#334155"/>

    <ellipse cx="320" cy="338" rx="52" ry="24" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <text x="320" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">+ 残差</text>

    <line x1="320" y1="362" x2="320" y2="384" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" style="color:#334155"/>

    <rect x="240" y="386" width="160" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="320" y="413" text-anchor="middle" font-size="13" fill="#1E293B">RMSNorm</text>

    <line x1="320" y1="430" x2="320" y2="452" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" style="color:#334155"/>

    <rect x="210" y="454" width="220" height="56" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="320" y="486" text-anchor="middle" font-size="14" font-weight="600" fill="#1E293B">前馈网络 FFN</text>

    <line x1="320" y1="510" x2="320" y2="532" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" style="color:#334155"/>

    <ellipse cx="320" cy="552" rx="52" ry="24" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <text x="320" y="556" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">+ 残差</text>

    <line x1="320" y1="576" x2="320" y2="598" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" style="color:#334155"/>

    <rect x="220" y="600" width="200" height="52" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="320" y="630" text-anchor="middle" font-size="14" font-weight="600" fill="#1E293B">层输出</text>

    <!-- KV cache -->
    <rect x="468" y="232" width="140" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#shadow)"/>
    <text x="538" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">历史 K/V</text>
    <text x="538" y="278" text-anchor="middle" font-size="11" fill="#64748B">KV Cache</text>

    <!-- Write -->
    <path d="M 440 252 C 456 252, 456 252, 468 252" fill="none" stroke="#059669" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow)" style="color:#059669"/>
    <text x="452" y="242" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">写 K/V</text>

    <!-- Read -->
    <path d="M 468 276 C 456 276, 456 276, 440 276" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow)" style="color:#059669"/>
    <text x="452" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">读历史</text>

    <!-- Residual skip lines -->
    <path d="M 180 114 C 140 114, 140 338, 180 338" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M 180 338 C 140 338, 140 552, 180 552" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="108" y="338" text-anchor="middle" font-size="10" fill="#94A3B8" transform="rotate(-90 108 338)">残差旁路</text>
  </g>

  <rect x="40" y="688" width="560" height="64" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="320" y="714" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748B">
    推理系统相关：因果掩码 → 历史 K/V 可缓存 · 自回归 → 必须逐步生成
  </text>
  <text x="320" y="736" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748B">
    采样发生在每步 forward 之后，仍在关键路径上
  </text>
</svg>
