<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dispatcher overview</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--color-paper:#f5f5f5}
    body{background:var(--color-paper)}
    .frame{width:1000px}
    svg{width:100%;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="ar" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2d3142"/></marker>
        <marker id="arA" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="60" y="46" fill="#4f5d75" font-size="11" font-family="'Geist Mono',monospace" letter-spacing="0.18em">CLUSTER DISPATCH</text>
      <text x="60" y="80" fill="#2d3142" font-size="26" font-family="'Instrument Serif',serif">One dispatcher, three competing goals</text>

      <!-- incoming requests -->
      <text x="60" y="150" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace" letter-spacing="0.10em">INCOMING REQUESTS</text>
      <!-- request cards, tag = shared prefix group -->
      <g font-family="'Geist Mono',monospace" font-size="10">
        <rect x="60" y="168" width="150" height="30" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)"/><text x="74" y="187" fill="#2d3142">req · prefix docA</text>
        <rect x="60" y="206" width="150" height="30" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)"/><text x="74" y="225" fill="#2d3142">req · prefix docA</text>
        <rect x="60" y="244" width="150" height="30" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)"/><text x="74" y="263" fill="#2d3142">req · prefix chat</text>
        <rect x="60" y="282" width="150" height="30" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)"/><text x="74" y="301" fill="#2d3142">req · prefix docB</text>
        <rect x="60" y="320" width="150" height="30" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)"/><text x="74" y="339" fill="#2d3142">req · prefix docA</text>
      </g>

      <line x1="214" y1="259" x2="356" y2="259" stroke="#2d3142" stroke-width="1.8" marker-end="url(#ar)"/>

      <!-- scheduler -->
      <rect x="360" y="196" width="212" height="126" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="374" y="210" width="88" height="15" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)"/>
      <text x="418" y="221" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">SCHEDULER</text>
      <text x="466" y="258" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">global scheduler</text>
      <text x="466" y="282" fill="#4f5d75" font-size="11" font-family="'Geist Mono',monospace" text-anchor="middle">route + admit</text>
      <text x="466" y="303" fill="#7a8399" font-size="10" font-family="'Geist',sans-serif" text-anchor="middle">one decision per request</text>

      <!-- three goals under scheduler -->
      <text x="360" y="366" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace" letter-spacing="0.10em">DECIDE BY BALANCING</text>
      <g font-family="'Geist',sans-serif">
        <rect x="360" y="378" width="205" height="42" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
        <text x="374" y="398" fill="#2d3142" font-size="12" font-weight="600">1 · cache hit</text>
        <text x="374" y="413" fill="#7a8399" font-size="9.5">reuse KV of a shared prefix</text>
        <rect x="360" y="428" width="205" height="42" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
        <text x="374" y="448" fill="#2d3142" font-size="12" font-weight="600">2 · load balance</text>
        <text x="374" y="463" fill="#7a8399" font-size="9.5">no single worker hotspots</text>
        <rect x="360" y="478" width="205" height="42" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
        <text x="374" y="498" fill="#2d3142" font-size="12" font-weight="600">3 · admission</text>
        <text x="374" y="513" fill="#7a8399" font-size="9.5">refuse early when overloaded</text>
      </g>

      <line x1="574" y1="240" x2="700" y2="240" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#arA)"/>
      <line x1="574" y1="278" x2="700" y2="300" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#ar)"/>

      <!-- prefill pool -->
      <text x="704" y="186" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace" letter-spacing="0.10em">PREFILL POOL</text>
      <g font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">
        <rect x="704" y="196" width="84" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><text x="746" y="228" fill="#2d3142">P1</text>
        <rect x="800" y="196" width="84" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><text x="842" y="228" fill="#2d3142">P2</text>
        <rect x="896" y="196" width="84" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><text x="938" y="228" fill="#2d3142">P3</text>
      </g>
      <!-- decode pool -->
      <text x="704" y="290" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace" letter-spacing="0.10em">DECODE POOL</text>
      <g font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">
        <rect x="704" y="300" width="84" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/><text x="746" y="332" fill="#2d3142">D1</text>
        <rect x="800" y="300" width="84" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/><text x="842" y="332" fill="#2d3142">D2</text>
        <rect x="896" y="300" width="84" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75"/><text x="938" y="332" fill="#2d3142">D3</text>
      </g>
      <text x="704" y="392" fill="#7a8399" font-size="10" font-family="'Geist',sans-serif">each worker keeps its own KV cache of recent prefixes</text>

      <!-- legend -->
      <line x1="60" y1="502" x2="980" y2="502" stroke="rgba(45,49,66,0.10)"/>
      <text x="620" y="516" fill="#7a8399" font-size="10" font-family="'Geist',sans-serif">the three goals pull in different directions — a scheduler is the tradeoff engine</text>
    </svg>
  </div>
</body>
</html>
