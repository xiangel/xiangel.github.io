<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="一次请求：Prefill 处理 prompt，Decode 逐步吐词">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="960" height="340" fill="#FFFFFF"/>

  <text x="480" y="36" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#1E293B">
    同一条请求：先 Prefill（算力密集），再 Decode（访存密集）
  </text>
  <text x="480" y="58" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748B">
    用户体感上对应「等到第一个字（TTFT）」与「字与字之间的间隔（TPOT）」
  </text>

  <!-- Prefill -->
  <rect x="40" y="88" width="300" height="96" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="190" y="114" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#C2410C">PREFILL</text>
  <text x="190" y="140" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#1E293B">整段 prompt 并行处理</text>
  <text x="190" y="164" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748B">写入 KV Cache · 等到第一个词</text>

  <line x1="340" y1="136" x2="378" y2="136" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" style="color:#334155"/>

  <!-- Decode tokens -->
  <g font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="388" y="108" width="56" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6" filter="url(#shadow)"/>
    <text x="416" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">词1</text>

    <line x1="444" y1="136" x2="462" y2="136" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow)" style="color:#2563EB"/>

    <rect x="468" y="108" width="56" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6" filter="url(#shadow)"/>
    <text x="496" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">词2</text>

    <line x1="524" y1="136" x2="542" y2="136" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow)" style="color:#2563EB"/>

    <rect x="548" y="108" width="56" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6" filter="url(#shadow)"/>
    <text x="576" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">词3</text>

    <text x="620" y="140" text-anchor="start" font-size="20" font-weight="500" fill="#94A3B8">…</text>
  </g>

  <rect x="388" y="88" width="292" height="96" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="534" y="104" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#2563EB">DECODE · 逐步吐词</text>

  <!-- TTFT -->
  <line x1="52" y1="206" x2="416" y2="206" stroke="#F97316" stroke-width="1.5"/>
  <polygon points="52,206 58,202 58,210" fill="#F97316"/>
  <polygon points="416,206 410,202 410,210" fill="#F97316"/>
  <text x="234" y="226" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#C2410C">TTFT（等到第一个字）</text>

  <!-- TPOT -->
  <line x1="388" y1="206" x2="444" y2="206" stroke="#2563EB" stroke-width="1.5"/>
  <polygon points="388,206 394,202 394,210" fill="#2563EB"/>
  <polygon points="444,206 438,202 438,210" fill="#2563EB"/>
  <text x="416" y="226" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#2563EB">TPOT（字间间隔）</text>

  <!-- KV bar -->
  <text x="40" y="268" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748B">KV Cache 长度 →</text>
  <rect x="160" y="252" width="760" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="160" y="252" width="300" height="22" rx="4" fill="#FDBA74" stroke="none"/>
  <rect x="460" y="252" width="56" height="22" fill="#93C5FD" stroke="none"/>
  <rect x="516" y="252" width="56" height="22" fill="#93C5FD" stroke="none"/>
  <rect x="572" y="252" width="56" height="22" fill="#93C5FD" stroke="none"/>
  <text x="310" y="292" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#C2410C">Prefill 写入</text>
  <text x="548" y="292" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#2563EB">Decode 逐步追加</text>
</svg>
