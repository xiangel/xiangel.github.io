<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase-specific optimization · Deployment</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; }
    body { background: var(--color-paper); }
    .frame { width: 1000px; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="phase-title phase-desc">
      <title id="phase-title">Phase-specific optimization: each pool gets its own parallelism, hardware, and count</title>
      <desc id="phase-desc">The prefill pool runs two instances at tensor parallelism 2 on compute-optimized GPUs; the decode pool runs three instances at tensor parallelism 8 on memory-bandwidth GPUs. KV cache moves from the prefill pool to the decode pool. The pools scale independently, tuning the prefill-to-decode ratio to match traffic, here two to three.</desc>
      <defs>
        <pattern id="ps-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="ps-arrow" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2d3142"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#ps-dots)" opacity="0.55"/>

      <!-- Heading -->
      <text x="60" y="46" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" letter-spacing="0.18em">PHASE-SPECIFIC OPTIMIZATION</text>
      <text x="60" y="78" fill="#2d3142" font-size="26" font-family="'Instrument Serif', serif">Each pool gets its own parallelism, hardware, and count</text>
      <text x="60" y="104" fill="#4f5d75" font-size="13" font-family="'Geist', sans-serif">Prefill wants small TP on compute GPUs; decode wants large TP on bandwidth GPUs.</text>

      <!-- PREFILL pool -->
      <rect x="60" y="150" width="376" height="288" rx="8" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="80" y="154" width="120" height="14" rx="2" fill="#f5f5f5"/>
      <text x="140" y="164" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PREFILL POOL</text>
      <text x="248" y="192" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">compute-bound → small TP, compute-optimized GPUs</text>
      <rect x="88" y="216" width="150" height="164" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="163" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">prefill</text>
      <text x="163" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">instance</text>
      <text x="163" y="352" fill="#eb6c36" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">TP=2</text>
      <rect x="258" y="216" width="150" height="164" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="333" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">prefill</text>
      <text x="333" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">instance</text>
      <text x="333" y="352" fill="#eb6c36" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">TP=2</text>
      <text x="248" y="410" fill="#eb6c36" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">2 instances</text>

      <!-- KV handoff -->
      <line x1="444" y1="290" x2="512" y2="290" stroke="#2d3142" stroke-width="1.8" marker-end="url(#ps-arrow)"/>
      <rect x="450" y="264" width="56" height="14" rx="2" fill="#f5f5f5"/>
      <text x="478" y="274" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KV</text>

      <!-- DECODE pool -->
      <rect x="520" y="150" width="440" height="288" rx="8" fill="rgba(79,93,117,0.08)" stroke="#4f5d75" stroke-width="1.2"/>
      <rect x="540" y="154" width="120" height="14" rx="2" fill="#f5f5f5"/>
      <text x="600" y="164" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DECODE POOL</text>
      <text x="740" y="192" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">memory-bound → large TP, memory/bandwidth GPUs</text>
      <rect x="548" y="212" width="124" height="172" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="610" y="290" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">decode</text>
      <text x="610" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">instance</text>
      <text x="610" y="350" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">TP=8</text>
      <rect x="680" y="212" width="124" height="172" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="742" y="290" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">decode</text>
      <text x="742" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">instance</text>
      <text x="742" y="350" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">TP=8</text>
      <rect x="812" y="212" width="124" height="172" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="874" y="290" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">decode</text>
      <text x="874" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">instance</text>
      <text x="874" y="350" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">TP=8</text>
      <text x="740" y="410" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">3 instances</text>

      <!-- caption -->
      <text x="500" y="468" fill="#2d3142" font-size="13" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="middle">Independent scaling: tune the P : D ratio to match traffic — here 2 : 3.</text>

      <!-- Legend -->
      <line x1="60" y1="496" x2="960" y2="496" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="60" y="526" width="16" height="10" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
      <text x="84" y="535" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">prefill pool (small TP)</text>
      <rect x="270" y="526" width="16" height="10" rx="2" fill="rgba(79,93,117,0.08)" stroke="#4f5d75" stroke-width="1"/>
      <text x="294" y="535" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">decode pool (large TP)</text>
      <line x1="480" y1="531" x2="508" y2="531" stroke="#2d3142" stroke-width="1.8" marker-end="url(#ps-arrow)"/>
      <text x="516" y="535" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">KV cache handoff</text>
    </svg>
  </div>
</body>
</html>
