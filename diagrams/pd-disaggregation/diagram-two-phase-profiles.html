<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prefill vs decode: opposite resource profiles · Bar chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36; }
    body { background: var(--color-paper); }
    .frame { width: 1000px; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pd-profiles-title pd-profiles-desc">
      <title id="pd-profiles-title">Prefill vs decode: opposite resource profiles</title>
      <desc id="pd-profiles-desc">Grouped bar chart of relative intensity across three metrics — compute (FLOPs), memory-bandwidth read, and tokens per iteration — comparing the prefill phase against the decode phase. Prefill is high on compute and tokens per iteration but low on memory bandwidth; decode is the mirror image, low on compute and tokens per iteration but high on memory bandwidth.</desc>
      <defs><pattern id="pd-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#pd-dots)" opacity="0.55"/>

      <!-- Heading baked into the diagram -->
      <text x="80" y="40" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" letter-spacing="0.18em">PREFILL VS DECODE</text>
      <text x="80" y="72" fill="#2d3142" font-size="26" font-family="'Instrument Serif', serif">Opposite resource profiles</text>
      <text x="80" y="98" fill="#4f5d75" font-size="13" font-family="'Geist', sans-serif">Prefill is compute-bound; decode is memory-bandwidth-bound. One heavy prefill pass is followed by</text>
      <text x="80" y="116" fill="#4f5d75" font-size="13" font-family="'Geist', sans-serif">many light decode steps, each re-reading the whole growing KV cache.</text>

      <!-- Y axis title -->
      <text transform="rotate(-90 24 320)" x="24" y="320" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">RELATIVE INTENSITY</text>

      <!-- Gridlines -->
      <line x1="80" y1="422" x2="960" y2="422" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="354" x2="960" y2="354" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="286" x2="960" y2="286" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="218" x2="960" y2="218" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="150" x2="960" y2="150" stroke="rgba(45,49,66,0.06)" stroke-width="0.8"/>
      <line x1="80" y1="150" x2="80" y2="490" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <line x1="80" y1="490" x2="960" y2="490" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

      <!-- Y tick labels -->
      <text x="72" y="493" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.0</text>
      <text x="72" y="425" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.2</text>
      <text x="72" y="357" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.4</text>
      <text x="72" y="289" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.6</text>
      <text x="72" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.8</text>
      <text x="72" y="153" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">1.0</text>

      <!-- Group 1: compute (FLOPs) -->
      <rect x="147" y="167" width="72" height="323" fill="#f5f5f5"/><rect x="147" y="167" width="72" height="323" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/><text x="183" y="159" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">0.95</text>
      <rect x="235" y="449" width="72" height="41" fill="#f5f5f5"/><rect x="235" y="449" width="72" height="41" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/><text x="271" y="441" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0.12</text>

      <!-- Group 2: mem BW read -->
      <rect x="440" y="371" width="72" height="119" fill="#f5f5f5"/><rect x="440" y="371" width="72" height="119" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/><text x="476" y="363" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">0.35</text>
      <rect x="528" y="167" width="72" height="323" fill="#f5f5f5"/><rect x="528" y="167" width="72" height="323" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/><text x="564" y="159" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0.95</text>

      <!-- Group 3: tokens / iter -->
      <rect x="733" y="167" width="72" height="323" fill="#f5f5f5"/><rect x="733" y="167" width="72" height="323" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/><text x="769" y="159" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">0.95</text>
      <rect x="821" y="470" width="72" height="20" fill="#f5f5f5"/><rect x="821" y="470" width="72" height="20" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/><text x="857" y="462" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0.06</text>

      <!-- X category labels -->
      <text x="227" y="510" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">compute (FLOPs)</text>
      <text x="520" y="510" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mem BW read</text>
      <text x="813" y="510" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">tokens / iter</text>

      <!-- Legend -->
      <line x1="80" y1="528" x2="960" y2="528" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="80" y="540" width="16" height="10" rx="2" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="104" y="549" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">prefill · compute-bound</text>
      <rect x="260" y="540" width="16" height="10" rx="2" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="284" y="549" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">decode · memory-bandwidth-bound</text>
    </svg>
  </div>
</body>
</html>
