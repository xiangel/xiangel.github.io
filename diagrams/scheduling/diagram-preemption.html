<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Preemption</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#f5f5f5}.frame{width:1000px}svg{width:100%;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="d3" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="a3" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eb6c36"/></marker>
        <marker id="a3m" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#d3)" opacity="0.55"/>

      <text x="60" y="46" fill="#4f5d75" font-size="11" font-family="'Geist Mono','Noto Sans CJK SC',monospace" letter-spacing="0.18em">抢占 · PREEMPTION</text>
      <text x="60" y="80" fill="#2d3142" font-size="24" font-family="'Instrument Serif','Noto Serif CJK SC',serif">显存打满时，腾出 KV block 的两条路</text>

      <rect x="60" y="170" width="230" height="110" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="175" y="210" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">GPU KV 池已满</text>
      <text x="175" y="234" fill="#4f5d75" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif" text-anchor="middle">新请求需要 block</text>
      <text x="175" y="256" fill="#7a8399" font-size="10" font-family="'Geist Mono','Noto Sans CJK SC',monospace" text-anchor="middle">挑一个受害者</text>

      <line x1="290" y1="204" x2="430" y2="154" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#a3)"/>
      <line x1="290" y1="246" x2="430" y2="296" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#a3m)"/>

      <rect x="434" y="116" width="480" height="96" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
      <text x="456" y="148" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">重算（丢掉 KV）</text>
      <text x="456" y="172" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">立刻腾出 block · 淘汰成本低</text>
      <text x="456" y="194" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">之后要从头再跑一遍 prefill · 花的是算力</text>

      <rect x="434" y="258" width="480" height="96" rx="8" fill="rgba(79,93,117,0.08)" stroke="#4f5d75"/>
      <text x="456" y="290" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">换出（KV → CPU 内存）</text>
      <text x="456" y="314" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans CJK SC',sans-serif">KV 留下，不用重算</text>
      <text x="456" y="336" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">代价：PCIe 拷出再拷回 · 花的是带宽</text>

      <line x1="60" y1="400" x2="940" y2="400" stroke="rgba(45,49,66,0.10)"/>
      <text x="60" y="432" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist','Noto Sans CJK SC',sans-serif">取舍：重算花算力 · 换出花带宽</text>
      <text x="60" y="456" fill="#7a8399" font-size="11" font-family="'Geist','Noto Sans CJK SC',sans-serif">无论哪条路，被抢占的请求都会回到等待队列，之后再重新调度。</text>
    </svg>
  </div>
</body>
</html>
