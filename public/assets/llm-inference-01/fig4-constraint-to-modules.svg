<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="从因果自回归约束到调度、显存管理、两段安排、推理执行模块">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1000" height="520" fill="#FFFFFF"/>

  <text x="500" y="36" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#1E293B">
    从「只往右生成」到推理系统模块
  </text>
  <text x="500" y="58" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748B">
    单条请求的约束 · 并发上线后长出调度、显存管理、Prefill/Decode 分工
  </text>

  <!-- Root -->
  <rect x="350" y="84" width="300" height="64" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="500" y="112" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#5B21B6">只往右生成</text>
  <text x="500" y="132" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748B">因果自回归 · next-token prediction</text>

  <g font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- Constraints row -->
    <rect x="40" y="196" width="200" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="140" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">一次要跑很多轮</text>
    <text x="140" y="246" text-anchor="middle" font-size="11" fill="#64748B">1 prefill + N decode</text>

    <rect x="270" y="196" width="200" height="72" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 3" filter="url(#shadow)"/>
    <text x="370" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">历史可缓存</text>
    <text x="370" y="246" text-anchor="middle" font-size="11" fill="#64748B">显存随长度涨</text>

    <rect x="500" y="196" width="200" height="72" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="600" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">读问题 ≠ 吐新词</text>
    <text x="600" y="246" text-anchor="middle" font-size="11" fill="#64748B">Prefill vs Decode</text>

    <rect x="730" y="196" width="200" height="72" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="830" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">有人短、有人长</text>
    <text x="830" y="246" text-anchor="middle" font-size="11" fill="#64748B">并发请求长短不一</text>

    <!-- Arrows root to constraints -->
    <path d="M 420 148 L 140 148 L 140 196" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" style="color:#334155"/>
    <path d="M 460 148 L 370 148 L 370 196" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" style="color:#334155"/>
    <path d="M 540 148 L 600 148 L 600 196" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" style="color:#334155"/>
    <path d="M 580 148 L 830 148 L 830 196" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" style="color:#334155"/>

    <!-- Modules row -->
    <polygon points="140,360 200,328 260,360 260,416 200,448 80,448 80,360" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="170" y="388" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">调度</text>
    <text x="170" y="408" text-anchor="middle" font-size="11" fill="#64748B">下一轮让谁上场</text>

    <rect x="300" y="352" width="140" height="80" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
    <ellipse cx="370" cy="352" rx="70" ry="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="370" cy="432" rx="70" ry="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <line x1="300" y1="352" x2="300" y2="432" stroke="#059669" stroke-width="1.5"/>
    <line x1="440" y1="352" x2="440" y2="432" stroke="#059669" stroke-width="1.5"/>
    <text x="370" y="388" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">显存管理</text>
    <text x="370" y="408" text-anchor="middle" font-size="11" fill="#64748B">按块管历史 K/V</text>

    <rect x="530" y="352" width="140" height="80" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="600" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">两段安排</text>
    <text x="600" y="404" text-anchor="middle" font-size="11" fill="#64748B">Prefill / Decode</text>
    <text x="600" y="420" text-anchor="middle" font-size="11" fill="#64748B">chunked · PD 分离</text>

    <rect x="760" y="352" width="140" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="830" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">推理执行</text>
    <text x="830" y="404" text-anchor="middle" font-size="11" fill="#64748B">真正去算</text>
    <text x="830" y="420" text-anchor="middle" font-size="11" fill="#64748B">接到用户请求</text>

    <!-- Arrows constraints to modules -->
    <line x1="140" y1="268" x2="170" y2="328" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)" style="color:#334155"/>
    <line x1="370" y1="268" x2="370" y2="342" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)" style="color:#334155"/>
    <line x1="600" y1="268" x2="600" y2="352" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)" style="color:#334155"/>
    <line x1="830" y1="268" x2="830" y2="352" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)" style="color:#334155"/>
  </g>

  <text x="500" y="492" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#94A3B8">
    第二篇 → 显存管理 · 第三篇 → 调度与两段安排
  </text>
</svg>
